<title>Utsav Sadhana</title>

<meta name="description" content="Festival-by-festival sadhana: what to do each day, the texts to recite, and a mala counter, from Ganeshotsav and Navratri to Diwali, Shivaratri and Janmashtami.">

<style>
/* Layout: a pothi-leaf reading column. Home opens on the next observance (a lamp-lit panel) and a deck of festival cards, each in its deity's colour. A festival opens on a calendar strip of its days, with today's checklist grouped by the hours of the day. A full-screen mala sheet does the japa. */
:root {
	--paper: #faf4e8;
	--surface: #f3e7d2;
	--card: #fffaf1;
	--ink: #2a1c10;
	--ink-2: #6d5643;
	--accent: #b0301c;      /* sindoor */
	--accent-ink: #fff8ee;
	--durva: #4d7a26;       /* durva grass: done, progress */
	--wash: #f6dcc8;
	--rule: #e6d5b9;
	--shadow: rgba(84, 46, 10, 0.14);
	--scrim: rgba(42, 28, 16, 0.38);
	--bead: #dcc6a0;
	--flame: #e08a1e;
	--gold: #b8892a;

	/* deity accents */
	--d-ganesha: #c23c17;   /* sindoor */
	--d-durga: #a5162b;     /* kumkum */
	--d-lakshmi: #a37612;   /* gold */
	--d-shiva: #4c6782;     /* ash-blue */
	--d-vishnu: #2f4a8a;    /* indigo */
	--d-krishna: #1d6478;   /* peacock */
	--d-rama: #c0620a;      /* saffron */
	--d-hanuman: #c24d0c;   /* deep saffron */
	--d-saraswati: #94770c; /* white-yellow, inked */
	--d-surya: #cf5a08;     /* sun-orange */

	--f-sa: "Tiro Devanagari Sanskrit", "Noto Serif Devanagari", "Kohinoor Devanagari", "Devanagari Sangam MN", "Mangal", serif;
	--f-mr: "Tiro Devanagari Marathi", "Tiro Devanagari Sanskrit", "Noto Serif Devanagari", "Kohinoor Devanagari", "Mangal", serif;
	--f-lat: "Gentium Book Plus", "Noto Serif", "Charis SIL", Georgia, serif;
	--f-ui: "Hind", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--paper: #120f17; --surface: #1d1922; --card: #18141d; --ink: #f0e4cf; --ink-2: #ab9e8c;
		--accent: #f07b5c; --accent-ink: #1d0904; --durva: #95c167; --wash: #33201f;
		--rule: #2c2631; --shadow: rgba(0, 0, 0, 0.5); --scrim: rgba(4, 3, 8, 0.66); --bead: #44394a;
		--flame: #f3a443; --gold: #d9ad55;
		--d-ganesha: #f2835c; --d-durga: #f0687a; --d-lakshmi: #e4b84e; --d-shiva: #9fbad2; --d-vishnu: #93a9e6;
		--d-krishna: #6cbcd2; --d-rama: #f2a54a; --d-hanuman: #f49152; --d-saraswati: #ecd879; --d-surya: #f7a347;
		color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--paper: #120f17; --surface: #1d1922; --card: #18141d; --ink: #f0e4cf; --ink-2: #ab9e8c;
	--accent: #f07b5c; --accent-ink: #1d0904; --durva: #95c167; --wash: #33201f;
	--rule: #2c2631; --shadow: rgba(0, 0, 0, 0.5); --scrim: rgba(4, 3, 8, 0.66); --bead: #44394a;
	--flame: #f3a443; --gold: #d9ad55;
	--d-ganesha: #f2835c; --d-durga: #f0687a; --d-lakshmi: #e4b84e; --d-shiva: #9fbad2; --d-vishnu: #93a9e6;
	--d-krishna: #6cbcd2; --d-rama: #f2a54a; --d-hanuman: #f49152; --d-saraswati: #ecd879; --d-surya: #f7a347;
	color-scheme: dark;
}
.acc-ganesha { --fa: var(--d-ganesha); } .acc-durga { --fa: var(--d-durga); } .acc-lakshmi { --fa: var(--d-lakshmi); }
.acc-shiva { --fa: var(--d-shiva); } .acc-vishnu { --fa: var(--d-vishnu); } .acc-krishna { --fa: var(--d-krishna); }
.acc-rama { --fa: var(--d-rama); } .acc-hanuman { --fa: var(--d-hanuman); } .acc-saraswati { --fa: var(--d-saraswati); }
.acc-surya { --fa: var(--d-surya); }
[class*="acc-"] { --tint: color-mix(in srgb, var(--fa) 9%, var(--card)); --tint-2: color-mix(in srgb, var(--fa) 16%, var(--card)); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
	background: var(--paper); color: var(--ink);
	font: 400 16px/1.55 var(--f-ui);
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
	padding-block: 0 48px;
	margin: 0;
}
.col { max-width: 42rem; margin: 0 auto; display: grid; gap: 1.6rem; min-width: 0; }
.col > * { min-width: 0; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; }
.sa { font-family: var(--f-sa); }
.mr { font-family: var(--f-mr); }
.lat { font-family: var(--f-lat); }
.muted { color: var(--ink-2); }
.eyebrow { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); font-weight: 500; }
.sec-h { display: flex; align-items: center; gap: .7rem; }
.sec-h::after { content: ""; flex: 1; height: 1px; background: var(--rule); }

/* motif: a toran of dots (marigold, leaf) and a small diya */
.toran { height: 10px; background:
	radial-gradient(circle at 50% 3px, var(--flame) 2.6px, transparent 3.2px) 0 0 / 18px 10px repeat-x,
	radial-gradient(circle at 50% 3px, var(--durva) 1.6px, transparent 2.2px) 9px 2px / 18px 10px repeat-x;
	opacity: .8; }
.diya { width: 1.6rem; height: 1.6rem; flex: 0 0 auto; }
.diya .bowl { fill: var(--gold); }
.diya .flame { fill: var(--flame); transform-origin: 12px 11px; }
.diya .core { fill: #fff3c9; }
@media (prefers-reduced-motion: no-preference) {
	.diya .flame { animation: flick 3.2s ease-in-out infinite; }
	@keyframes flick { 0%, 100% { transform: scale(1, 1) rotate(0); } 40% { transform: scale(.96, 1.06) rotate(-2deg); } 70% { transform: scale(1.03, .97) rotate(1.5deg); } }
}

/* header */
.top {
	position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
	background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
	border-bottom: 1px solid var(--rule);
	margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
	padding: .55rem max(16px, env(safe-area-inset-right, 0px)) .55rem max(16px, env(safe-area-inset-left, 0px));
}
.top-in { max-width: 42rem; margin: 0 auto; display: flex; align-items: center; gap: .75rem; }
.brand { display: flex; align-items: center; gap: .5rem; flex: 1; min-width: 0; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.brand b { font-family: var(--f-sa); font-size: 1.35rem; font-weight: 400; color: var(--accent); line-height: 1.2; }
.brand span { font-size: .95rem; font-weight: 600; white-space: nowrap; }
.tabs { display: flex; gap: .2rem; background: var(--surface); border-radius: 99px; padding: .2rem; }
.tab { border: 0; background: none; padding: .3rem .8rem; border-radius: 99px; cursor: pointer; font-size: .88rem; color: var(--ink-2); }
.tab[aria-current="page"] { background: var(--card); color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px var(--shadow); }
.sync { font-size: .72rem; color: var(--ink-2); padding: .4rem 0 0; text-align: right; max-width: 42rem; margin: 0 auto; }

main { padding-top: 1.1rem; }

/* home: the next observance */
.next {
	position: relative; overflow: hidden;
	background: linear-gradient(160deg, var(--tint-2, var(--surface)) 0%, var(--tint, var(--surface)) 55%, var(--card) 100%);
	border-radius: 20px; padding: 1.3rem 1.3rem 1.25rem;
	display: grid; gap: .7rem; border: 1px solid color-mix(in srgb, var(--fa, var(--accent)) 22%, var(--rule));
	box-shadow: 0 10px 30px -18px var(--shadow);
}
.next .toran { margin: -1.3rem -1.3rem .1rem; }
.next .head { display: flex; align-items: center; gap: .5rem; }
.next .live { color: var(--fa); font-weight: 600; }
.next .live::before { content: ""; display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; background: var(--fa); margin-right: .45rem; vertical-align: .08em; box-shadow: 0 0 0 3px color-mix(in srgb, var(--fa) 22%, transparent); }
.next .big { font-family: var(--f-sa); font-size: clamp(2.2rem, 10vw, 3.3rem); line-height: 1.15; color: var(--fa, var(--accent)); overflow-wrap: anywhere; }
.next h2 { font-size: 1.2rem; }
.next .when { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: .6rem 1rem; font-variant-numeric: tabular-nums; }
.next .when .date { font-weight: 500; }
.count { display: grid; justify-items: end; line-height: 1; text-align: right; }
.count b { font-size: 2.4rem; font-weight: 500; color: var(--fa, var(--accent)); font-variant-numeric: tabular-nums; }
.count small { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin-top: .25rem; }
.now { display: grid; gap: .2rem; padding: .75rem .9rem; border-radius: 12px; background: color-mix(in srgb, var(--card) 70%, transparent); border: 1px solid color-mix(in srgb, var(--fa) 18%, var(--rule)); }
.now b { font-size: 1.05rem; }
.now .bar { margin-top: .35rem; }
.bar { height: 6px; border-radius: 99px; background: var(--rule); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--durva); border-radius: inherit; transition: width .3s; }
.btn {
	display: inline-flex; align-items: center; gap: .4rem; justify-self: start;
	border: 0; border-radius: 99px; padding: .6rem 1.15rem; cursor: pointer;
	background: var(--fa, var(--accent)); color: var(--accent-ink); font-weight: 500; text-decoration: none;
}
.btn.quiet { background: var(--tint-2, var(--wash)); color: var(--ink); }
.then { font-size: .95rem; }

/* home: festival cards */
.list { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 18rem), 1fr)); }
.row {
	position: relative; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: .3rem .9rem;
	padding: .9rem 1rem .9rem 1.15rem; border: 1px solid color-mix(in srgb, var(--fa) 20%, var(--rule)); border-radius: 16px;
	background: var(--tint); text-align: left; cursor: pointer; width: 100%; overflow: hidden;
	transition: transform .15s, box-shadow .15s;
}
.row::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--fa); }
.row:hover { box-shadow: 0 8px 22px -16px var(--shadow); transform: translateY(-1px); }
.row:disabled { cursor: default; opacity: .6; }
.row .chipdate { display: grid; justify-items: center; width: 3.3rem; padding: .35rem 0 .3rem; border-radius: 10px; background: var(--card); border: 1px solid color-mix(in srgb, var(--fa) 25%, var(--rule)); line-height: 1.05; font-variant-numeric: tabular-nums; }
.row .chipdate b { font-size: 1.35rem; font-weight: 600; color: var(--fa); }
.row .chipdate small { font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.row .t { min-width: 0; display: grid; gap: .05rem; }
.row .dv { font-family: var(--f-sa); font-size: 1.3rem; color: var(--fa); line-height: 1.3; }
.row .t b { font-weight: 600; }
.row .t small { color: var(--ink-2); font-size: .84rem; }
.pill { font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; padding: .12rem .5rem; border-radius: 99px; background: var(--fa); color: var(--accent-ink); white-space: nowrap; justify-self: start; }
.pill.soon { background: none; color: var(--fa); border: 1px solid currentColor; }

/* festival */
.hero { display: grid; gap: .35rem; }
.hero .dv { font-family: var(--f-sa); font-size: clamp(2.2rem, 9vw, 3.1rem); color: var(--fa, var(--accent)); line-height: 1.2; }
.hero h1 { font-size: 1.45rem; }
.hero.banner { padding: 1.2rem 1.25rem 1.15rem; border-radius: 20px; background: linear-gradient(160deg, var(--tint-2) 0%, var(--tint) 60%, var(--card) 100%); border: 1px solid color-mix(in srgb, var(--fa) 22%, var(--rule)); overflow: hidden; }
.hero.banner .toran { margin: -1.2rem -1.25rem .5rem; }
.hero .tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .35rem; }
.tag { font-size: .78rem; padding: .15rem .6rem; border-radius: 99px; background: var(--card); border: 1px solid color-mix(in srgb, var(--fa) 22%, var(--rule)); color: var(--ink-2); }
.tag.on { color: var(--fa); font-weight: 600; }
.lede { max-width: 62ch; font-size: 1.02rem; }

.panchang { border-radius: 16px; background: var(--card); border: 1px solid var(--rule); overflow: hidden; }
.panchang .ph { display: flex; justify-content: space-between; align-items: center; gap: .6rem; padding: .6rem 1rem; background: var(--surface); border-bottom: 1px solid var(--rule); }
.panchang .ph span:last-child { font-size: .8rem; color: var(--fa, var(--accent)); font-weight: 500; }
.facts { display: grid; grid-template-columns: minmax(9rem, auto) 1fr; margin: 0; font-size: .95rem; }
.facts dt, .facts dd { padding: .55rem 1rem; border-bottom: 1px dashed var(--rule); }
.facts dt:last-of-type, .facts dd:last-of-type { border-bottom: 0; }
.facts dt { color: var(--ink-2); }
.facts dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 500; }
.panchang .src { padding: .5rem 1rem .65rem; border-top: 1px solid var(--rule); }
.src { font-size: .78rem; color: var(--ink-2); }
.choose { display: grid; gap: .45rem; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip { border: 1px solid var(--rule); background: var(--card); border-radius: 99px; padding: .35rem .85rem; cursor: pointer; font-size: .9rem; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip-note { font-size: .85rem; color: var(--ink-2); }
.plan { display: grid; gap: 1rem; padding: 1rem; border-radius: 16px; background: var(--surface); }

.strip-wrap { display: grid; gap: .5rem; }
.strip { display: flex; gap: .45rem; overflow-x: auto; padding: .35rem .1rem .6rem; scroll-snap-type: x proximity; scrollbar-width: thin; }
.day {
	position: relative; flex: 0 0 auto; width: 4.3rem; scroll-snap-align: start;
	display: grid; justify-items: center; gap: .1rem; padding: .45rem .2rem .5rem;
	border: 1px solid var(--rule); border-radius: 14px; background: var(--card); cursor: pointer;
	font-variant-numeric: tabular-nums;
}
.day .num { font-size: .62rem; color: var(--ink-2); text-transform: uppercase; letter-spacing: .08em; }
.day small { font-size: .66rem; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
.day b { font-size: 1.3rem; line-height: 1.1; font-weight: 600; }
.day.gone { opacity: .55; }
.day.is-today { border-color: var(--fa, var(--accent)); box-shadow: inset 0 0 0 1px var(--fa, var(--accent)); }
.day.is-today::after { content: "Today"; position: absolute; top: -.55rem; left: 50%; transform: translateX(-50%); font-size: .58rem; letter-spacing: .08em; text-transform: uppercase; background: var(--fa, var(--accent)); color: var(--accent-ink); padding: .05rem .4rem; border-radius: 99px; }
.day[aria-pressed="true"] { background: var(--fa, var(--accent)); border-color: var(--fa, var(--accent)); opacity: 1; }
.day[aria-pressed="true"] b, .day[aria-pressed="true"] small, .day[aria-pressed="true"] .num { color: var(--accent-ink); }
.day[aria-pressed="true"] .ring .bg { stroke: color-mix(in srgb, var(--accent-ink) 35%, transparent); }
.day[aria-pressed="true"] .ring .fg { stroke: var(--accent-ink); }
.ring { width: 20px; height: 20px; margin-top: .15rem; }
.ring circle { fill: none; stroke-width: 3; }
.ring .bg { stroke: var(--rule); }
.ring .fg { stroke: var(--durva); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }

.today { display: grid; gap: .9rem; }
.today h2 { font-size: 1.4rem; }
.today .tithi { color: var(--fa, var(--accent)); font-weight: 500; font-size: 1rem; display: block; margin-top: .1rem; }
.today .focus { font-size: 1.02rem; padding-left: .9rem; border-left: 2px solid color-mix(in srgb, var(--fa, var(--accent)) 45%, transparent); }
.progress { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: .35rem 1rem; padding: .75rem .95rem; border-radius: 14px; background: var(--surface); }
.progress .bar { grid-column: 1 / -1; }
.progress b { font-variant-numeric: tabular-nums; }
.progress span { font-size: .85rem; color: var(--ink-2); }
.notice { border-left: 3px solid var(--accent); padding: .7rem .95rem; background: var(--surface); border-radius: 0 12px 12px 0; display: grid; gap: .4rem; }
.notice .sa { font-size: 1.2rem; line-height: 1.7; white-space: pre-line; }

.check { display: grid; gap: 1.1rem; }
.slot { display: grid; gap: .5rem; }
.slot-h { display: flex; align-items: center; gap: .55rem; font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.slot-h svg { width: 1.1rem; height: 1.1rem; stroke: var(--fa, var(--accent)); fill: none; stroke-width: 1.6; stroke-linecap: round; }
.slot-h::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.slot-list { display: grid; gap: .5rem; }
.task { display: grid; grid-template-columns: 2.2rem 1fr; gap: .2rem .75rem; padding: .8rem .9rem; border-radius: 14px; background: var(--card); border: 1px solid var(--rule); transition: background .2s, border-color .2s; }
.task.done { background: color-mix(in srgb, var(--durva) 7%, var(--card)); border-color: color-mix(in srgb, var(--durva) 25%, var(--rule)); }
.tick {
	width: 1.95rem; height: 1.95rem; border-radius: 50%; border: 2px solid var(--bead); background: none; cursor: pointer;
	display: grid; place-items: center; padding: 0; transition: background .15s, border-color .15s;
}
.tick svg { width: 1rem; height: 1rem; stroke: var(--accent-ink); stroke-width: 3; fill: none; opacity: 0; }
.tick[aria-checked="true"] { background: var(--durva); border-color: var(--durva); }
.tick[aria-checked="true"] svg { opacity: 1; stroke: var(--paper); }
.task .body { min-width: 0; display: grid; gap: .15rem; }
.task .time { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--fa, var(--accent)); font-weight: 500; }
.task .title { font-weight: 600; }
.task.done .title { color: var(--ink-2); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--durva) 60%, transparent); }
.task .detail { font-size: .92rem; color: var(--ink-2); }
.task .acts { display: flex; flex-wrap: wrap; gap: .5rem 1rem; padding-top: .3rem; align-items: center; }
.link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-weight: 500; font-size: .9rem; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.meter { font-size: .85rem; font-variant-numeric: tabular-nums; color: var(--durva); font-weight: 500; }

details.fold { border-top: 1px solid var(--rule); padding: .8rem 0; }
details.fold:last-of-type { border-bottom: 1px solid var(--rule); }
details.fold summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 1rem; }
details.fold summary::-webkit-details-marker { display: none; }
details.fold summary::after { content: "+"; color: var(--ink-2); font-weight: 400; }
details.fold[open] summary::after { content: "–"; }
details.fold > div { padding-top: .7rem; display: grid; gap: .6rem; }
.kv { display: grid; grid-template-columns: minmax(7rem, 11rem) 1fr; gap: .4rem 1rem; font-size: .93rem; }
.kv b { font-weight: 500; }
ol.steps { margin: 0; padding-left: 1.4rem; columns: 2 13rem; column-gap: 2rem; font-size: .93rem; }
.texts { display: grid; gap: .4rem; }

/* sankashti dates */
.dates { display: grid; gap: .5rem; }
.date-btn { display: grid; grid-template-columns: 4.6rem 1fr auto; gap: .8rem; align-items: center; text-align: left; border: 1px solid var(--rule); border-radius: 14px; padding: .65rem .85rem; background: var(--card); cursor: pointer; }
.date-btn[aria-pressed="true"] { border-color: var(--fa, var(--accent)); background: var(--tint, var(--wash)); box-shadow: inset 3px 0 0 var(--fa, var(--accent)); }
.date-btn b { font-variant-numeric: tabular-nums; }
.date-btn small { color: var(--ink-2); display: block; font-size: .82rem; }

/* reader */
.script-tog { display: flex; gap: .3rem; }
.text-body { display: grid; gap: 1.4rem; }
.verse { display: grid; gap: .35rem; position: relative; }

<script>
/*CONTENT*/
const TEXTS = /*TEXTS*/;
/*TRANSLIT*/

(function () {
	"use strict";
	const $ = (id) => document.getElementById(id);
	const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
	const iast = (s, marathi) => deva2iast(s, marathi);
	const MALA = 108;
	const DAY_MS = 86400000;
	const main = $("main");

	/* ---------- dates (all local, date-only) ---------- */
	const pad = (n) => String(n).padStart(2, "0");
	const isoOf = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
	const dateOf = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
	const todayIso = () => isoOf(new Date());
	const daysTo = (iso) => Math.round((dateOf(iso) - dateOf(todayIso())) / DAY_MS);
	const fmt = (iso, o) => dateOf(iso).toLocaleDateString("en-IN", o || { weekday: "short", day: "numeric", month: "short", year: "numeric" });
	const inDays = (n) => n === 0 ? "today" : n === 1 ? "tomorrow" : n > 1 ? "in " + n + " days" : Math.abs(n) + " days ago";

	/* ---------- state: per person in db when signed in, else this browser ---------- */
	const KEY = "utsav-sadhana";
	let state = { done: {}, japa: {}, plan: {}, script: "both", scale: 1, rec: {} };
	try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) state = Object.assign(state, s); } catch (e) { /* no storage */ }
	let remote = null;   // db doc reference once available
	let saveT = null;
	function save() {
		try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* no storage */ }
		if (!remote) return;
		clearTimeout(saveT);
		saveT = setTimeout(() => {
			remote.set({ done: state.done, japa: state.japa, plan: state.plan, script: state.script, at: Date.now() }).catch(() => {
				$("sync").textContent = "Couldn't save to your account just now; progress is kept in this browser.";
			});
		}, 600);
	}
	function mergeMax(a, b) {
		const out = Object.assign({}, a);
		for (const k in b) {
			const x = out[k], y = b[k];
			if (x && typeof x === "object" && y && typeof y === "object") out[k] = mergeMax(x, y);
			else if (typeof x === "number" && typeof y === "number") out[k] = Math.max(x, y);
			else if (x === undefined) out[k] = y;
			else if (y === true) out[k] = true;
		}
		return out;
	}
	(async function connect() {
		if (!window.claude || !window.claude.use) return;
		try {
			const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
			if (!db || !user) return;
			const id = await user.id();
			if (!id) return;
			const ref = db.collection("data/users/" + id).doc("sadhana");
			const snap = await ref.get();
			const d = snap && (typeof snap.data === "function" ? snap.data() : snap.data);
			if (d) {
				state.done = mergeMax(state.done, d.done || {});
				state.japa = mergeMax(state.japa, d.japa || {});
				state.plan = Object.assign({}, d.plan || {}, state.plan);
				if (d.script) state.script = d.script;
			}
			remote = ref;
			$("sync").textContent = "Your progress is saved to your Claude account, privately.";
			save();
			render();
		} catch (e) { /* stay local */ }
	})();

	/* The GitHub Pages copy, opened directly: the only place downloads and offline work. In the claude.ai artifact these stay hidden. */
	let PAGES = false;
	try { PAGES = location.protocol === "https:" && window.self === window.top && /\.github\.io$/.test(location.hostname); } catch (e) { /* framed */ }
	if (PAGES && "serviceWorker" in navigator) {
		window.addEventListener("load", () => {
			navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then((reg) => {
				const urls = performance.getEntriesByType("resource").map((r) => r.name).filter((u) => /^https:\/\/fonts\.(googleapis|gstatic)\.com\//.test(u));
				if (reg.active && urls.length) reg.active.postMessage({ type: "cache-fonts", urls });
			}).catch(() => {});
		});
	}
	/* an .ics of the festival's dates, as all-day events */
	let icsUrl = null;
	function icsFor(f) {
		const d8 = (iso) => iso.replace(/-/g, "");
		const next = (iso) => { const d = dateOf(iso); d.setDate(d.getDate() + 1); return isoOf(d); };
		const txt = (v) => String(v).replace(/[\\;,]/g, (c) => "\\" + c).replace(/\n/g, "\\n");
		const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
		const ev = f.monthly ? f.dates.map((d) => [d.date, d.date, d.name + " Sankashti Chaturthi", "Moonrise " + d.moon + " (Pune)" + (d.note ? ". " + d.note : "")]) : [[f.start, f.end, f.name + (f.year ? " " + f.year : ""), f.sub]];
		const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Utsav Sadhana//EN", "CALSCALE:GREGORIAN"];
		ev.forEach(([a, b, name, desc], i) => lines.push("BEGIN:VEVENT", "UID:" + f.id + "-" + a + "-" + i + "@utsav-sadhana", "DTSTAMP:" + stamp, "DTSTART;VALUE=DATE:" + d8(a), "DTEND;VALUE=DATE:" + d8(next(b)), "SUMMARY:" + txt(name), "DESCRIPTION:" + txt(desc), "TRANSP:TRANSPARENT", "END:VEVENT"));
		lines.push("END:VCALENDAR");
		if (icsUrl) URL.revokeObjectURL(icsUrl);
		icsUrl = URL.createObjectURL(new Blob([lines.join("\r\n") + "\r\n"], { type: "text/calendar" }));
		return icsUrl;
	}

	/* ---------- lookups ---------- */
	const FEST = Object.fromEntries(FESTIVALS.map((f) => [f.id, f]));
	const GOD = Object.fromEntries(DEITIES.map((d) => [d.id, d]));
	const mantraOf = (ref) => { const [g, m] = ref.split("/"); return GOD[g].mantras.find((x) => x.id === m); };
	const planOf = (f) => (state.plan[f.id] = Object.assign({ days: f.durations ? f.durations[f.durations.length - 1].days : 1, malas: 1 }, state.plan[f.id] || {}));
	const doneKey = (f, iso, t) => f.id + ":" + iso + ":" + t;
	const japaOf = (ref) => (state.japa[ref] = Object.assign({ total: 0, n: 0, byDay: {} }, state.japa[ref] || {}));
	const japaOn = (ref, iso) => (japaOf(ref).byDay[iso] || 0);

	/* the days a festival plan covers, given the chosen duration */
	function planDays(f) {
		if (f.monthly) return f.dates.map((d) => ({ date: d.date, title: d.name + " Sankashti", tithi: "Moonrise " + d.moon, focus: d.note || "" }));
		if (!f.durations) return f.days;
		const n = Math.ceil(planOf(f).days);
		return f.days.slice(0, Math.max(2, n));
	}
	function dayProgress(f, iso) {
		const items = f.core;
		let n = 0;
		for (const t of items) if (state.done[doneKey(f, iso, t.id)]) n++;
		return n / items.length;
	}
	function nextObservance() {
		const t = todayIso();
		const all = [];
		for (const f of FESTIVALS) {
			if (f.status !== "ready") continue;
			if (f.monthly) f.dates.forEach((d) => all.push({ f, date: d.date, end: d.date, label: d.name + " Sankashti", extra: "Moonrise " + d.moon + " (Pune)" + (d.note ? ". " + d.note : "") }));
			else all.push({ f, date: f.start, end: f.end, label: f.name + " " + f.year, extra: fmt(f.start, { day: "numeric", month: "short" }) + " to " + fmt(f.end, { day: "numeric", month: "short" }) });
		}
		return all.filter((x) => x.end >= t).sort((a, b) => a.date.localeCompare(b.date));
	}

	/* ---------- views ---------- */
	function setTab(name) {
		$("tab-home").setAttribute("aria-current", name === "home" ? "page" : "false");
		$("tab-cal").setAttribute("aria-current", name === "cal" ? "page" : "false");
		$("tab-mantra").setAttribute("aria-current", name === "mantra" ? "page" : "false");
	}
	function ringSvg(p) {
		const c = 2 * Math.PI * 8;
		return '<svg class="ring" viewBox="0 0 22 22" aria-hidden="true"><circle class="bg" cx="11" cy="11" r="8"/><circle class="fg" cx="11" cy="11" r="8" stroke-dasharray="' + (c * p).toFixed(2) + " " + c.toFixed(2) + '"/></svg>';
	}

	const acc = (f) => "acc-" + f.deity;
	const TORAN = '<div class="toran" aria-hidden="true"></div>';
	function doneCount(f, iso) { let n = 0; for (const t of f.core) if (state.done[doneKey(f, iso, t.id)]) n++; return n; }
	function progressHtml(f, iso) {
		const n = doneCount(f, iso), all = f.core.length;
		return '<b>' + n + " of " + all + " done" + (iso === todayIso() ? " today" : "") + '</b><span>' + (n === all ? "Complete" : (all - n) + " to go") + '</span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + all + '" aria-valuenow="' + n + '" aria-label="Checklist progress"><i style="width:' + Math.round(100 * n / all) + '%"></i></div>';
	}

	function viewHome() {
		setTab("home");
		const up = nextObservance();
		let h = "";
		if (up.length) {
			const x = up[0];
			const d = daysTo(x.date);
			const t = todayIso();
			const live = x.date <= t && x.end >= t;
			const now = live && !x.f.monthly ? x.f.days.find((y) => y.date === t) : null;
			const idx = now ? x.f.days.indexOf(now) + 1 : 0;
			h += '<section class="next ' + acc(x.f) + '" aria-labelledby="next-h">' + TORAN +
				'<span class="eyebrow' + (live ? " live" : "") + '">' + (live ? "Happening now" : "Next observance") + '</span>' +
				'<span class="big" lang="sa">' + esc(x.f.deva) + '</span>' +
				'<h2 id="next-h">' + esc(x.label) + '</h2>' +
				'<div class="when"><div><p class="date">' + esc(fmt(x.date, { weekday: "long", day: "numeric", month: "long", year: "numeric" })) + '</p><p class="muted">' + esc(x.extra) + '</p></div>' +
				(live ? (idx ? '<span class="count"><b>' + idx + '</b><small>day of ' + x.f.days.length + '</small></span>' : '<span class="count"><b>Today</b></span>')
					: '<span class="count"><b>' + d + '</b><small>' + (d === 1 ? "day to go" : "days to go") + '</small></span>') + '</div>';
			if (now) h += '<div class="now"><span class="eyebrow">Today · ' + esc(now.tithi) + '</span><b>' + esc(now.title) + '</b>' + (now.focus ? '<p class="muted">' + esc(now.focus) + '</p>' : "") +
				'<div class="progress" style="padding:0;background:none;margin-top:.3rem">' + progressHtml(x.f, t) + '</div></div>';
			h += '<button class="btn" data-go="f/' + x.f.id + (x.f.monthly ? "/" + x.date : "") + '">' + (live ? "Open today's sadhana" : "Open the sadhana") + '</button></section>';
			const later = up.find((y) => y.f.id !== x.f.id);
			if (later) h += '<p class="muted then">Then <a href="#f/' + later.f.id + '" data-go="f/' + later.f.id + '">' + esc(later.label) + '</a>, ' + esc(inDays(daysTo(later.date))) + '.</p>';
		}
		h += todayCard();
		h += '<section aria-labelledby="all-h" style="display:grid;gap:.8rem"><h2 id="all-h" class="eyebrow sec-h">Festivals</h2><div class="list">';
		// Every festival, soonest first by its next date (a monthly one by its next occurrence).
		const t0 = todayIso();
		const nextOf = (f) => f.monthly ? (f.dates.find((d) => d.date >= t0) || f.dates[f.dates.length - 1]).date : (f.end >= t0 ? f.start : "9" + f.start);
		const byDate = FESTIVALS.slice().sort((a, b) => nextOf(a).localeCompare(nextOf(b)));
		for (const f of byDate) {
			const ready = f.status === "ready";
			const nd = f.monthly ? nextOf(f) : f.start;
			const live = !f.monthly && f.start <= t0 && f.end >= t0;
			const when = f.monthly ? "Every month · next " + fmt(nd, { day: "numeric", month: "short" }) : f.start ? fmt(f.start, { weekday: "short", day: "numeric", month: "short", year: "numeric" }) : "";
			const chip = nd ? '<span class="chipdate" aria-hidden="true"><small>' + esc(fmt(nd, { month: "short" })) + '</small><b>' + dateOf(nd).getDate() + '</b><small>' + dateOf(nd).getFullYear() + '</small></span>' : '<span class="chipdate" aria-hidden="true"><b>·</b></span>';
			const dn = daysTo(nd || t0);
			const pill = !ready ? '<span class="pill soon">Coming</span>' : live ? '<span class="pill">Happening now</span>' : (dn >= 0 && dn <= 45 ? '<span class="pill soon">' + esc(inDays(dn)) + '</span>' : "");
			h += '<button class="row ' + acc(f) + '" ' + (ready ? 'data-go="f/' + f.id + '"' : "disabled") + '>' + chip + '<span class="t"><span class="dv">' + esc(f.deva) + '</span><b>' + esc(f.name) + '</b><small>' + esc(GOD[f.deity].name) + (when ? " · " + esc(when) : "") + '</small>' + pill + '</span></button>';
		}
		h += '</div></section>';
		h += footer();
		main.innerHTML = h;
	}

	/* today: the weekday's deity, and the japa streak across every mantra */
	const WEEKDAY = ["surya/suryaya", "shiva/panchakshari", "hanuman/ham", "ganesha/gam", "vishnu/ashtakshari", "lakshmi/mahalakshmi", "hanuman/ham"];
	function japaDays() {
		const by = {};
		for (const k in state.japa) { const d = (state.japa[k] && state.japa[k].byDay) || {}; for (const iso in d) if (d[iso] > 0) by[iso] = (by[iso] || 0) + d[iso]; }
		return by;
	}
	function streak() {
		const by = japaDays();
		const d = new Date(); d.setHours(12, 0, 0, 0);
		if (!by[isoOf(d)]) d.setDate(d.getDate() - 1); // today not counted yet: the streak still stands from yesterday
		let n = 0;
		while (by[isoOf(d)]) { n++; d.setDate(d.getDate() - 1); }
		const w = new Date(); w.setHours(12, 0, 0, 0); w.setDate(w.getDate() - ((w.getDay() + 6) % 7)); // Monday
		let week = 0;
		for (let i = 0; i < 7; i++) { week += by[isoOf(w)] || 0; w.setDate(w.getDate() + 1); }
		return { days: n, today: by[todayIso()] || 0, week };
	}
	function todayCard() {
		const ref = WEEKDAY[new Date().getDay()];
		const g = GOD[ref.split("/")[0]], m = mantraOf(ref);
		const st = streak();
		const malas = Math.floor(st.week / MALA);
		return '<section class="daycard acc-' + g.id + '" aria-labelledby="today-h"><span class="eyebrow" id="today-h">' + esc(fmt(todayIso(), { weekday: "long" })) + " · " + esc(g.name) + '</span>' +
			'<p class="sa">' + esc(m.deva) + '</p><p class="lat">' + esc(iast(m.deva)) + '</p>' +
			'<div class="acts"><button class="btn quiet" data-japa="' + ref + '" data-iso="' + todayIso() + '" data-target="' + m.count + '">Count on mala</button><span class="meter">' + (st.today ? st.today + " counted today" : "") + '</span></div>' +
			'<p class="streak" id="streak"><span><b>' + st.days + '</b> ' + (st.days === 1 ? "day" : "days") + ' in a row</span><span><b>' + malas + '</b> ' + (malas === 1 ? "mala" : "malas") + ' this week' + (st.week % MALA ? " + " + (st.week % MALA) : "") + '</span></p></section>';
	}

	/* the year: every observance by month, today's place marked */
	function viewCal() {
		setTab("cal");
		const t = todayIso();
		const all = [];
		for (const f of FESTIVALS) {
			if (f.status !== "ready") continue;
			if (f.monthly) f.dates.forEach((d) => all.push({ f, date: d.date, end: d.date, label: d.name + " Sankashti", sub: "Moonrise " + d.moon + (d.note ? " · " + d.note : "") }));
			else all.push({ f, date: f.start, end: f.end, label: f.name, sub: f.start === f.end ? fmt(f.start, { weekday: "long" }) : fmt(f.start, { day: "numeric", month: "short" }) + " – " + fmt(f.end, { day: "numeric", month: "short" }) + " · " + (Math.round((dateOf(f.end) - dateOf(f.start)) / DAY_MS) + 1) + " days" });
		}
		all.sort((a, b) => a.date.localeCompare(b.date) || a.end.localeCompare(b.end));
		let h = '<section class="hero"><span class="dv">पञ्चाङ्ग</span><h1>The year\'s observances</h1><p class="muted">October 2026 to September 2027, dates for Pune. Tap one to open its sadhana.</p></section>';
		let marked = false;
		for (let i = 0; i < 12; i++) {
			const m0 = new Date(2026, 9 + i, 1), key = m0.getFullYear() + "-" + pad(m0.getMonth() + 1);
			const items = all.filter((x) => x.date.slice(0, 7) === key);
			if (!items.length) continue;
			h += '<section class="cal-m" aria-label="' + esc(fmt(key + "-01", { month: "long", year: "numeric" })) + '"><h2 class="eyebrow sec-h">' + esc(fmt(key + "-01", { month: "long", year: "numeric" })) + '</h2>';
			for (const x of items) {
				if (!marked && x.end >= t) { marked = true; if (x.date > t) h += '<p class="cal-now" id="cal-now">Today · ' + esc(fmt(t, { day: "numeric", month: "short" })) + '</p>'; }
				const live = x.date <= t && x.end >= t;
				const day = x.f.monthly ? x.date : live ? t : x.date;
				const pill = live ? '<span class="pill">Now</span>' : x.end >= t && daysTo(x.date) <= 45 ? '<span class="pill soon">' + esc(inDays(daysTo(x.date))) + '</span>' : "";
				h += '<button class="cal-row ' + acc(x.f) + (x.end < t ? " gone" : "") + (live ? " live" : "") + '"' + (live ? ' id="cal-now"' : "") + ' data-go="f/' + x.f.id + "/" + day + '"><span class="cd"><b>' + dateOf(x.date).getDate() + '</b><small>' + esc(fmt(x.date, { weekday: "short" })) + '</small></span><span class="ct"><b>' + esc(x.label) + '</b><small>' + esc(x.sub) + '</small></span>' + pill + '</button>';
			}
			h += '</section>';
		}
		h += '<p class="src">Festival dates, muhurat and moonrise: Drik Panchang, Pune, checked 16 Oct 2026.</p>';
		h += footer();
		main.innerHTML = h;
	}

	function taskHtml(f, iso, t, slot) {
		const k = doneKey(f, iso, t.id);
		const on = !!state.done[k];
		let acts = "";
		if (t.text) acts += '<button class="link" data-go="t/' + t.text + '">Read ' + esc(TEXTS[t.text].short) + '</button>';
		if (t.mantra && !t.japa) acts += '<button class="link" data-japa="' + t.mantra + '" data-iso="' + iso + '">Count on mala</button>';
		if (t.japa) {
			const target = planOf(f).malas * MALA;
			const got = japaOn(t.mantra, iso);
			acts += '<button class="link" data-japa="' + t.mantra + '" data-iso="' + iso + '" data-task="' + k + '" data-target="' + target + '">Start japa</button><span class="meter">' + got + " / " + target + '</span>';
		}
		return '<div class="task' + (on ? " done" : "") + '"><button class="tick" role="checkbox" aria-checked="' + on + '" data-tick="' + k + '" aria-label="' + esc(t.title) + '"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></button>' +
			'<div class="body">' + (slot && slot.toLowerCase() === t.time.toLowerCase() ? "" : '<span class="time">' + esc(t.time) + '</span>') + '<span class="title">' + esc(t.title) + '</span><span class="detail">' + esc(t.detail) + '</span>' + (acts ? '<span class="acts">' + acts + '</span>' : "") + '</div></div>';
	}

	/* the hours of the day: checklist items are grouped by when they are done, keeping their order within a group */
	const SLOTS = [
		["Morning", /dawn|sunrise|morning|before/i, '<circle cx="12" cy="15" r="4"/><path d="M3 19h18M12 5v3M5.6 9.6l2 2M18.4 9.6l-2 2"/>'],
		["Through the day", /midday|any time|through/i, '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>'],
		["Evening", /dusk|evening|moonrise/i, '<path d="M7 16a5 5 0 0 1 10 0M3 19h18M12 6v3M6 9l1.5 1.5M18 9l-1.5 1.5"/>'],
		["Night", /night|midnight|prahar/i, '<path d="M19 14.5A7 7 0 0 1 9.5 5a7 7 0 1 0 9.5 9.5z"/>'],
	];
	const slotOf = (t) => { const i = SLOTS.findIndex((s) => s[1].test(t.time)); return i < 0 ? 1 : i; };
	function checklistHtml(f, iso) {
		let h = "";
		SLOTS.forEach((s, i) => {
			const items = f.core.filter((t) => slotOf(t) === i);
			if (!items.length) return;
			h += '<div class="slot"><h3 class="slot-h"><svg viewBox="0 0 24 24" aria-hidden="true">' + s[2] + '</svg>' + s[0] + '</h3><div class="slot-list">' + items.map((x) => taskHtml(f, iso, x, s[0])).join("") + '</div></div>';
		});
		return h;
	}

	function viewFestival(id, pick) {
		setTab("home");
		const f = FEST[id];
		if (!f || f.status !== "ready") return viewHome();
		const plan = planOf(f);
		const days = planDays(f);
		const t = todayIso();
		let sel = pick && days.find((d) => d.date === pick) ? pick : (days.find((d) => d.date === t) || days.find((d) => d.date > t) || days[0]).date;
		const day = days.find((d) => d.date === sel);
		document.body.className = acc(f);
		const liveF = !f.monthly && f.start <= t && f.end >= t;
		let h = '<button class="link back" data-go="">← All festivals</button>';
		const span = f.monthly ? "Every month" : f.start === f.end ? fmt(f.start, { day: "numeric", month: "short", year: "numeric" }) : fmt(f.start, { day: "numeric", month: "short" }) + " – " + fmt(f.end, { day: "numeric", month: "short", year: "numeric" });
		h += '<section class="hero banner">' + TORAN + '<span class="dv">' + esc(f.deva) + '</span><h1>' + esc(f.name) + (f.year ? " " + f.year : "") + '</h1><p class="muted">' + esc(f.sub) + '</p>' +
			'<div class="tags"><span class="tag">' + esc(span) + '</span><span class="tag">' + esc(GOD[f.deity].name) + '</span>' + (liveF ? '<span class="tag on">Happening now</span>' : "") + '</div>' +
			(PAGES ? '<a class="btn quiet" id="ics" style="margin-top:.6rem" href="' + icsFor(f) + '" download="' + f.id + '.ics">Add to calendar</a>' : '<a class="btn quiet" id="ics" hidden></a>') + '</section>';
		h += '<p class="lede">' + esc(f.intro) + '</p>';
		if (f.facts) h += '<section class="panchang" aria-label="Panchang"><div class="ph"><span class="eyebrow">Panchang · Pune</span><span>' + (liveF ? "Happening now" : esc(inDays(daysTo(f.start))).replace(/^./, (c) => c.toUpperCase())) + '</span></div><dl class="facts">' + f.facts.map(([k, v]) => "<dt>" + esc(k) + "</dt><dd>" + esc(v) + "</dd>").join("") + '</dl><p class="src">' + esc(f.factsSrc) + '.</p></section>';

		h += '<section class="plan" aria-label="Your plan">';
		if (f.durations) {
			const cur = f.durations.find((d) => d.days === plan.days) || f.durations[f.durations.length - 1];
			h += '<section class="choose"><span class="eyebrow" id="dur-l">How long Ganpati stays</span><div class="chips" role="group" aria-labelledby="dur-l">' +
				f.durations.map((d) => '<button class="chip" aria-pressed="' + (d === cur) + '" data-days="' + d.days + '">' + esc(d.label) + '</button>').join("") + '</div><p class="chip-note">' + esc(cur.note) + '</p></section>';
		}
		h += '<section class="choose"><span class="eyebrow" id="mal-l">Daily japa</span><div class="chips" role="group" aria-labelledby="mal-l">' +
			[1, 3, 11].map((m) => '<button class="chip" aria-pressed="' + (plan.malas === m) + '" data-malas="' + m + '">' + m + (m === 1 ? " mala" : " malas") + " · " + (m * MALA) + '</button>').join("") + '</div></section></section>';

		if (f.monthly) {
			h += '<section class="dates" aria-label="Dates">' + f.dates.map((d) => '<button class="date-btn" aria-pressed="' + (d.date === sel) + '" data-day="' + d.date + '"><b>' + esc(fmt(d.date, { day: "numeric", month: "short" })) + '</b><span>' + esc(d.name) + '<small>' + esc(fmt(d.date, { weekday: "long" })) + (d.note ? " · " + esc(d.note) : "") + '</small></span><span class="meter">Moon ' + esc(d.moon) + '</span></button>').join("") + '</section><p class="src">' + esc(f.datesSrc) + '</p>';
		} else {
			const m0 = fmt(days[0].date, { month: "long", year: "numeric" }), m1 = fmt(days[days.length - 1].date, { month: "long", year: "numeric" });
			h += '<section class="strip-wrap" aria-labelledby="strip-h"><h2 class="eyebrow sec-h" id="strip-h">' + esc(m0 === m1 ? m0 : m0 + " – " + m1) + '</h2>' +
				'<div class="strip" role="group" aria-label="Days of the festival">' + days.map((d, i) => '<button class="day' + (d.date < t ? " gone" : "") + (d.date === t ? " is-today" : "") + '" aria-pressed="' + (d.date === sel) + '" data-day="' + d.date + '" aria-label="Day ' + (i + 1) + ", " + esc(fmt(d.date, { weekday: "long", day: "numeric", month: "long" })) + (d.date === t ? ", today" : "") + '"><span class="num">Day ' + (i + 1) + '</span><b>' + dateOf(d.date).getDate() + '</b><small>' + esc(fmt(d.date, { weekday: "short" })) + '</small>' + ringSvg(dayProgress(f, d.date)) + '</button>').join("") + '</div></section>';
		}

		h += '<section class="today" aria-labelledby="day-h"><div><span class="eyebrow">' + esc(fmt(day.date, { weekday: "long", day: "numeric", month: "long" })) + " · " + esc(inDays(daysTo(day.date))) + '</span><h2 id="day-h">' + esc(day.title) + ' <span class="tithi">' + esc(day.tithi) + '</span></h2></div>';
		if (day.focus) h += '<p class="focus">' + esc(day.focus) + '</p>';
		h += '<div class="progress">' + progressHtml(f, day.date) + '</div>';
		if (day.special && day.special.includes("moon") && f.moon) h += '<div class="notice"><b>If you see the moon by mistake</b><p class="muted">' + esc(f.moon.why) + '</p><p class="sa">' + esc(f.moon.deva) + '</p><p class="lat keep">' + esc(iast(f.moon.deva)) + '</p><p>' + esc(f.moon.mean) + '</p><p class="src">' + esc(f.moon.src) + '</p></div>';
		if (day.special && day.special.includes("shodasha")) h += '<details class="fold" open><summary>Shodashopachara: the sixteen offerings</summary><div><ol class="steps">' + f.shodasha.map((s) => "<li>" + esc(s) + "</li>").join("") + '</ol><p class="src">One common order; your family or purohit may differ.</p></div></details>';
		h += '<div class="check">' + checklistHtml(f, day.date) + '</div></section>';

		if (f.samagri) h += '<details class="fold"><summary>Samagri</summary><div class="kv">' + f.samagri.map(([k, v]) => "<b>" + esc(k) + "</b><span>" + esc(v) + "</span>").join("") + '</div></details>';
		const used = [...new Set(f.core.filter((x) => x.text).map((x) => x.text))];
		h += '<details class="fold"><summary>Texts for this sadhana</summary><div class="texts">' + used.map((k) => '<button class="link" data-go="t/' + k + '">' + esc(TEXTS[k].title) + '</button>').join("") + '<button class="link" data-go="d/' + f.deity + '">All ' + esc(GOD[f.deity].name) + ' mantras</button></div></details>';
		h += footer();
		main.innerHTML = h;
		const strip = main.querySelector(".strip"), on = strip && strip.querySelector('[aria-pressed="true"]');
		if (on) strip.scrollLeft = Math.max(0, on.offsetLeft - strip.offsetLeft - (strip.clientWidth - on.offsetWidth) / 2);
	}

	/* the verse's own number, from its closing ॥ ७॥, shown in the margin (the text itself is untouched) */
	const vnum = (b) => { const m = b.lines[b.lines.length - 1].match(/॥\s*([०-९]+)\s*॥\s*$/); return m ? m[1] : ""; };
	function viewText(key) {
		setTab("home");
		const tx = TEXTS[key];
		if (!tx) return viewHome();
		const mr = tx.lang === "mr" || tx.lang === "hi";
		const cls = mr ? "mr" : "sa";
		let h = '<button class="link back" data-back>← Back</button>';
		h += '<section class="hero"><span class="dv' + (mr ? " mr" : "") + '">' + esc(tx.deva) + '</span><h1>' + esc(tx.title) + '</h1><p class="muted">' + esc(tx.about) + '</p></section>';
		h += '<div class="rtools"><div class="script-tog chips" role="group" aria-label="Script">' + [["both", "Both"], ["deva", "देवनागरी"], ["iast", "IAST"]].map(([k, l]) => '<button class="chip" aria-pressed="' + (state.script === k) + '" data-script="' + k + '">' + l + '</button>').join("") + '</div>' +
			'<span class="sizes" role="group" aria-label="Text size"><button class="chip" data-size="-1" aria-label="Smaller text">A−</button><span id="size-pct">' + Math.round(scale() * 100) + '%</span><button class="chip" data-size="1" aria-label="Larger text">A+</button></span>' +
			'<button class="btn" data-recite="' + key + '">Recite</button></div>';
		if (tx.names) {
			h += '<ol class="names" style="--scale:' + scale() + '">' + tx.names.map((n) => '<li><span class="sa">' + esc(n) + '</span><span class="lat">' + esc(iast(n)) + '</span></li>').join("") + '</ol>';
		} else {
			h += '<div class="text-body reader" style="--scale:' + scale() + '">' + tx.blocks.map((b) => b.head ? '<div class="verse"><h3>' + esc(b.head) + ' <span class="lat keep">' + esc(iast(b.head)) + '</span></h3></div>' :
				'<div class="verse' + (vnum(b) ? ' v" data-n="' + vnum(b) : "") + '"><p class="' + cls + '">' + esc(b.lines.join("\n")) + '</p><p class="lat">' + esc(b.lines.map((l) => iast(l, mr)).join("\n")) + '</p>' + (b.mean ? '<p class="mean">' + esc(b.mean) + '</p>' : "") + '</div>').join("") + '</div>';
		}
		if (tx.mean) h += '<details class="fold"><summary>Meaning</summary><div><p class="mean" style="white-space:pre-line">' + esc(tx.mean) + '</p></div></details>';
		h += '<p class="src">Source: <a href="' + esc(tx.url) + '" target="_blank" rel="noopener">' + esc(tx.src) + '</a>. ' + esc(tx.credit || "") + '</p>';
		h += footer();
		main.innerHTML = h;
		document.body.dataset.script = state.script;
	}

	/* text size, 85–160%, remembered */
	const scale = () => Math.min(1.6, Math.max(0.85, Number(state.scale) || 1));
	function setScale(d) {
		state.scale = Math.round(Math.min(1.6, Math.max(0.85, scale() + d * 0.15)) * 100) / 100;
		save();
		document.querySelectorAll(".text-body, .names, .recite").forEach((el) => el.style.setProperty("--scale", scale()));
		const p = $("size-pct"); if (p) p.textContent = Math.round(scale() * 100) + "%";
	}

	/* recite: one verse at a time, with its own mala for counting recitations */
	const rcEl = $("recite");
	let rc = null; // { key, units, i }
	function unitsOf(tx) {
		if (tx.names) return tx.names.map((n) => ({ lines: [n] }));
		const out = [];
		let head = "";
		for (const b of tx.blocks) { if (b.head) { head = b.head; continue; } out.push({ head, lines: b.lines }); head = ""; }
		return out;
	}
	function renderRecite(dir) {
		const tx = TEXTS[rc.key], u = rc.units[rc.i], mr = tx.lang === "mr" || tx.lang === "hi";
		const card = $("rc-card");
		const draw = () => {
			const len = u.lines.join("").length;
			card.className = "rc-card" + (u.lines.length > 4 || len > 220 ? " long" : "");
			card.innerHTML = (u.head ? '<h3>' + esc(u.head) + ' · <span class="lat keep">' + esc(iast(u.head)) + '</span></h3>' : "") +
				(state.script !== "iast" ? '<p class="' + (mr ? "mr" : "sa") + '">' + esc(u.lines.join("\n")) + '</p>' : "") +
				(state.script !== "deva" ? '<p class="lat">' + esc(u.lines.map((l) => iast(l, mr)).join("\n")) + '</p>' : "");
			$("rc-stage").scrollTop = 0;
		};
		$("rc-title").textContent = tx.title;
		$("rc-pos").textContent = (rc.i + 1) + " of " + rc.units.length;
		$("rc-bar").style.width = ((rc.i + 1) / rc.units.length * 100).toFixed(2) + "%";
		$("rc-prev").disabled = rc.i === 0;
		$("rc-next").disabled = rc.i === rc.units.length - 1;
		if (!dir || matchMedia("(prefers-reduced-motion: reduce)").matches) return draw();
		card.classList.add(dir > 0 ? "out-l" : "out-r");
		setTimeout(() => { draw(); card.classList.add(dir > 0 ? "out-r" : "out-l"); requestAnimationFrame(() => requestAnimationFrame(() => card.classList.remove("out-l", "out-r"))); }, 130);
	}
	function renderRcMala() {
		const ref = "text/" + rc.key, j = japaOf(ref), n = j.n % MALA;
		$("rc-mala-n").textContent = n;
		rcBeads.forEach((b, i) => b.classList.toggle("on", i < n));
		$("rc-mala-meta").textContent = japaOn(ref, todayIso()) + " today · " + j.total + " in all";
		$("rc-mala").setAttribute("aria-label", "Count one recitation. " + n + " of 108");
	}
	function rcStep(d) {
		const n = rc.i + d;
		if (n < 0 || n >= rc.units.length) return;
		rc.i = n; state.rec[rc.key] = n; save();
		renderRecite(d);
	}
	let rcWake = null;
	function openRecite(key) {
		const tx = TEXTS[key];
		if (!tx) return;
		const units = unitsOf(tx);
		const r = state.rec && state.rec[key];
		rc = { key, units, i: typeof r === "number" && r < units.length ? r : 0 };
		rcEl.style.setProperty("--scale", scale());
		rcEl.hidden = false;
		document.documentElement.style.overflow = "hidden";
		renderRecite(0); renderRcMala();
		$("rc-stage").focus({ preventScroll: true });
		if (navigator.wakeLock) navigator.wakeLock.request("screen").then((w) => { rcWake = w; }).catch(() => {});
	}
	function closeRecite() {
		rcEl.hidden = true;
		document.documentElement.style.overflow = "";
		if (rcWake) { rcWake.release().catch(() => {}); rcWake = null; }
		rc = null;
		save();
		render();
	}
	$("rc-close").addEventListener("click", closeRecite);
	$("rc-prev").addEventListener("click", () => rcStep(-1));
	$("rc-next").addEventListener("click", () => rcStep(1));
	$("rc-smaller").addEventListener("click", () => setScale(-1));
	$("rc-bigger").addEventListener("click", () => setScale(1));
	$("rc-mala").addEventListener("click", () => {
		const ref = "text/" + rc.key, j = japaOf(ref);
		j.n += 1; j.total += 1; j.byDay[todayIso()] = japaOn(ref, todayIso()) + 1;
		if (navigator.vibrate) navigator.vibrate(j.n % MALA === 0 ? [60, 60, 120] : 12);
		renderRcMala(); save();
	});
	(function () {
		let tx = null;
		const st = $("rc-stage");
		st.addEventListener("touchstart", (e) => { tx = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null; }, { passive: true });
		st.addEventListener("touchend", (e) => {
			if (!tx) return;
			const t = e.changedTouches[0], dx = t.clientX - tx.x, dy = t.clientY - tx.y;
			tx = null;
			if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4) rcStep(dx < 0 ? 1 : -1);
		}, { passive: true });
	})();
	document.addEventListener("keydown", (e) => {
		if (rcEl.hidden) return;
		if (e.key === "Escape") closeRecite();
		else if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); rcStep(1); }
		else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); rcStep(-1); }
	});

	function viewMantras() {
		setTab("mantra");
		let h = '<section class="hero"><span class="dv">मन्त्र</span><h1>Mantras by deity</h1><p class="muted">Each with its source, the usual count, and a mala to count on.</p></section>';
		h += '<div class="gods">' + DEITIES.map((d) => '<button class="god acc-' + d.id + '" data-go="d/' + d.id + '"><span class="dv">' + esc(d.deva) + '</span><b>' + esc(d.name) + '</b><small>' + esc(d.day) + '</small></button>').join("") + '</div>';
		h += '<p class="src">Seed (bija) mantras such as गं, श्रीं, ऐं, दुं and हं are traditionally learnt from a guru. The nama mantras and shlokas are open to everyone.</p>';
		h += footer();
		main.innerHTML = h;
	}

	function viewDeity(id) {
		setTab("mantra");
		const d = GOD[id];
		if (!d) return viewMantras();
		document.body.className = "acc-" + d.id;
		let h = '<button class="link back" data-go="mantras">← All deities</button>';
		h += '<section class="hero banner">' + TORAN + '<span class="dv">' + esc(d.deva) + '</span><h1>' + esc(d.name) + '</h1><p class="muted">' + esc(d.about) + " Days: " + esc(d.day) + '.</p></section><div class="mantras">';
		for (const m of d.mantras) {
			const ref = d.id + "/" + m.id;
			const j = japaOf(ref);
			h += '<article class="mantra"><span class="eyebrow">' + esc(m.name) + '</span><p class="sa">' + esc(m.deva) + '</p><p class="lat">' + esc(iast(m.deva)) + '</p><p class="mean">' + esc(m.mean) + '</p>' +
				'<p class="meta"><span>Usual count: ' + m.count + '</span><span>' + esc(m.src) + '</span>' + (j.total ? '<span class="meter">' + j.total + ' counted so far</span>' : "") + '</p>' +
				'<button class="btn quiet" data-japa="' + ref + '" data-iso="' + todayIso() + '" data-target="' + m.count + '">Count on mala</button></article>';
		}
		h += '</div>';
		const fests = FESTIVALS.filter((f) => f.deity === d.id);
		if (fests.length) h += '<p class="muted">Festivals: ' + fests.map((f) => f.status === "ready" ? '<a href="#f/' + f.id + '" data-go="f/' + f.id + '">' + esc(f.name) + "</a>" : esc(f.name) + " (coming)").join(", ") + '.</p>';
		h += footer();
		main.innerHTML = h;
	}

	function footer() {
		return '<footer class="foot">' + TORAN + '<p>Long texts are reproduced from <a href="https://sanskritdocuments.org" target="_blank" rel="noopener">sanskritdocuments.org</a> (volunteer-prepared, for personal study) and the aarti from Wikipedia. Festival dates and moonrise are for Pune, from Drik Panchang.</p><p>Follow your family custom or purohit where it differs.</p></footer>';
	}

	/* ---------- router ---------- */
	let route = "";
	let history_ = [];
	function go(r, opts) {
		if (!opts || !opts.back) history_.push(route);
		route = r;
		try { if (/^[A-Za-z0-9._~-]*$/.test(r.replace(/\//g, "-"))) location.hash = r ? r.replace(/\//g, "-") : ""; } catch (e) { /* ignore */ }
		render();
		window.scrollTo(0, 0);
		main.focus({ preventScroll: true });
	}
	function render() {
		const [kind, a, b] = route.split("/");
		document.body.className = "";
		if (kind === "f") viewFestival(a, b);
		else if (kind === "t") viewText(a);
		else if (kind === "mantras") viewMantras();
		else if (kind === "cal") viewCal();
		else if (kind === "d") viewDeity(a);
		else viewHome();
		document.body.dataset.script = state.script;
	}
	function fromHash() {
		const h = (location.hash || "").slice(1);
		const m = h.match(/^(f|t|d)-([a-z0-9]+)(?:-(\d{4}-\d{2}-\d{2}))?$/);
		if (m) return m[1] + "/" + m[2] + (m[3] ? "/" + m[3] : "");
		return h === "mantras" || h === "cal" ? h : "";
	}

	/* ---------- japa sheet ---------- */
	const sheet = $("japa");
	let jp = null; // { ref, iso, task, target }
	let wake = null;
	function buildBeads(svgId) {
		const ns = "http://www.w3.org/2000/svg";
		const svg = $(svgId);
		const core = document.createElementNS(ns, "circle");
		core.setAttribute("cx", "66"); core.setAttribute("cy", "66"); core.setAttribute("r", "47"); core.setAttribute("class", "core");
		svg.appendChild(core);
		for (let i = 0; i < MALA; i++) {
			const a = (-90 + (i + 1.5) * (360 / (MALA + 3))) * Math.PI / 180;
			const c = document.createElementNS(ns, "circle");
			c.setAttribute("cx", (66 + 60 * Math.cos(a)).toFixed(2)); c.setAttribute("cy", (66 + 60 * Math.sin(a)).toFixed(2));
			c.setAttribute("r", "1.75"); c.setAttribute("class", "bead");
			svg.appendChild(c);
		}
		const meru = document.createElementNS(ns, "circle");
		meru.setAttribute("cx", "66"); meru.setAttribute("cy", "6"); meru.setAttribute("r", "3.4"); meru.setAttribute("class", "meru");
		svg.appendChild(meru);
		return Array.from(svg.querySelectorAll(".bead"));
	}
	const beads = buildBeads("mala-svg");
	const rcBeads = buildBeads("rc-mala-svg");
	function renderJapa() {
		const j = japaOf(jp.ref);
		const n = j.n % MALA;
		const today = japaOn(jp.ref, jp.iso);
		$("mala-n").textContent = n;
		beads.forEach((b, i) => b.classList.toggle("on", i < n));
		$("japa-today").innerHTML = (jp.iso === todayIso() ? "Today " : esc(fmt(jp.iso, { day: "numeric", month: "short" })) + " ") + "<b>" + today + "</b>" + (jp.target ? " of " + jp.target : "");
		$("japa-total").textContent = j.total + " in all";
		$("mala").setAttribute("aria-label", "Count one repetition. " + n + " of 108 on this mala, " + today + " today");
	}
	function openJapa(ref, iso, task, target) {
		const m = mantraOf(ref);
		jp = { ref, iso, task, target: target ? Number(target) : 0 };
		$("japa-name").textContent = GOD[ref.split("/")[0]].name + " · " + m.name;
		$("japa-deva").textContent = m.deva;
		$("japa-iast").textContent = iast(m.deva);
		sheet.hidden = false;
		document.documentElement.style.overflow = "hidden";
		renderJapa();
		$("mala").focus();
		if (navigator.wakeLock) navigator.wakeLock.request("screen").then((w) => { wake = w; }).catch(() => {});
	}
	function closeJapa() {
		sheet.hidden = true;
		document.documentElement.style.overflow = "";
		if (wake) { wake.release().catch(() => {}); wake = null; }
		jp = null;
		save();
		render();
	}
	function count(d) {
		const j = japaOf(jp.ref);
		if (d < 0 && (j.n <= 0 || japaOn(jp.ref, jp.iso) <= 0)) return;
		j.n += d; j.total += d;
		j.byDay[jp.iso] = japaOn(jp.ref, jp.iso) + d;
		const today = j.byDay[jp.iso];
		if (navigator.vibrate) navigator.vibrate(d > 0 && j.n % MALA === 0 ? [60, 60, 120] : 12);
		if (jp.task) state.done[jp.task] = jp.target ? today >= jp.target : state.done[jp.task];
		renderJapa();
		save();
	}
	$("mala").addEventListener("click", () => count(1));
	$("mala-undo").addEventListener("click", () => count(-1));
	$("japa-close").addEventListener("click", closeJapa);
	document.addEventListener("keydown", (e) => {
		if (sheet.hidden) return;
		if (e.key === "Escape") closeJapa();
		else if ((e.key === " " || e.key === "Enter") && document.activeElement === $("mala")) { e.preventDefault(); count(1); }
	});
	document.addEventListener("visibilitychange", () => {
		// The browser drops the lock while the page is hidden; ask again when it comes back.
		if (document.visibilityState !== "visible") { wake = null; return; }
		if (!sheet.hidden && !wake && navigator.wakeLock) navigator.wakeLock.request("screen").then((w) => { wake = w; }).catch(() => {});
	});

	/* ---------- events ---------- */
	document.addEventListener("click", (e) => {
		const el = e.target.closest("[data-go],[data-tick],[data-days],[data-malas],[data-day],[data-japa],[data-script],[data-back],[data-size],[data-recite]");
		if (!el) return;
		if (el.tagName === "A") e.preventDefault();
		const [kind, id] = route.split("/");
		if (el.dataset.size) return setScale(Number(el.dataset.size));
		if (el.dataset.recite) return openRecite(el.dataset.recite);
		if (el.dataset.japa) return openJapa(el.dataset.japa, el.dataset.iso, el.dataset.task, el.dataset.target);
		if (el.hasAttribute("data-back")) { const p = history_.pop(); return go(p || "", { back: true }); }
		if (el.dataset.go !== undefined) return go(el.dataset.go);
		if (el.dataset.tick) { state.done[el.dataset.tick] = !state.done[el.dataset.tick]; save(); render(); return; }
		if (el.dataset.days) { state.plan[id].days = Number(el.dataset.days); save(); render(); return; }
		if (el.dataset.malas) { state.plan[id].malas = Number(el.dataset.malas); save(); render(); return; }
		if (el.dataset.day) { route = "f/" + id + "/" + el.dataset.day; render(); return; }
		if (el.dataset.script) { state.script = el.dataset.script; save(); render(); }
	});
	$("home-btn").addEventListener("click", () => go(""));
	window.addEventListener("hashchange", () => {
		const r = fromHash();
		if (r !== route && !route.startsWith(r + "/")) { route = r; render(); }
	});

	route = fromHash();
	render();
})();
</script>
