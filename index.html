<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Utsav Sadhana</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Festival-by-festival sadhana: what to do each day, the texts to recite, and a mala counter, from Ganeshotsav and Navratri to Diwali, Shivaratri and Janmashtami.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Hind:wght@400;500;600&family=Tiro+Devanagari+Marathi&family=Tiro+Devanagari+Sanskrit&display=swap">
<style>
/* Layout: a pothi-leaf reading column. Home lists the next observance and every festival; a festival opens on a strip of its days, with today's checklist under it. A full-screen mala sheet does the japa. */
:root {
	--paper: #faf4e8;
	--surface: #f3e7d2;
	--ink: #2a1c10;
	--ink-2: #6d5643;
	--accent: #b0301c;      /* sindoor */
	--accent-ink: #fff8ee;
	--durva: #4d7a26;       /* durva grass: done, progress */
	--wash: #f6dcc8;
	--rule: #e6d5b9;
	--shadow: rgba(84, 46, 10, 0.14);
	--scrim: rgba(42, 28, 16, 0.38);
	--bead: #dcc6a0;

	--f-sa: "Tiro Devanagari Sanskrit", "Noto Serif Devanagari", "Kohinoor Devanagari", "Devanagari Sangam MN", "Mangal", serif;
	--f-mr: "Tiro Devanagari Marathi", "Tiro Devanagari Sanskrit", "Noto Serif Devanagari", "Kohinoor Devanagari", "Mangal", serif;
	--f-lat: "Gentium Book Plus", "Noto Serif", "Charis SIL", Georgia, serif;
	--f-ui: "Hind", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--paper: #120f17; --surface: #1d1922; --ink: #f0e4cf; --ink-2: #ab9e8c;
		--accent: #f07b5c; --accent-ink: #1d0904; --durva: #95c167; --wash: #33201f;
		--rule: #2c2631; --shadow: rgba(0, 0, 0, 0.5); --scrim: rgba(4, 3, 8, 0.66); --bead: #44394a;
		color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--paper: #120f17; --surface: #1d1922; --ink: #f0e4cf; --ink-2: #ab9e8c;
	--accent: #f07b5c; --accent-ink: #1d0904; --durva: #95c167; --wash: #33201f;
	--rule: #2c2631; --shadow: rgba(0, 0, 0, 0.5); --scrim: rgba(4, 3, 8, 0.66); --bead: #44394a;
	color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
	background: var(--paper); color: var(--ink);
	font: 400 16px/1.55 var(--f-ui);
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
	padding-block: 0 48px;
}
.col { max-width: 42rem; margin: 0 auto; display: grid; gap: 1.5rem; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; }
.sa { font-family: var(--f-sa); }
.mr { font-family: var(--f-mr); }
.lat { font-family: var(--f-lat); }
.muted { color: var(--ink-2); }
.eyebrow { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); font-weight: 500; }

/* header */
.top {
	position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
	background: var(--paper); border-bottom: 1px solid var(--rule);
	margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
	padding: .6rem max(16px, env(safe-area-inset-right, 0px)) .6rem max(16px, env(safe-area-inset-left, 0px));
}
.top-in { max-width: 42rem; margin: 0 auto; display: flex; align-items: center; gap: .75rem; }
.brand { display: flex; align-items: baseline; gap: .5rem; flex: 1; min-width: 0; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.brand b { font-family: var(--f-sa); font-size: 1.35rem; font-weight: 400; color: var(--accent); }
.brand span { font-size: .95rem; font-weight: 600; white-space: nowrap; }
.tabs { display: flex; gap: .25rem; }
.tab { border: 0; background: none; padding: .35rem .7rem; border-radius: 99px; cursor: pointer; font-size: .9rem; color: var(--ink-2); }
.tab[aria-current="page"] { background: var(--wash); color: var(--ink); font-weight: 500; }
.sync { font-size: .72rem; color: var(--ink-2); padding: .4rem 0 0; text-align: right; max-width: 42rem; margin: 0 auto; }

main { padding-top: 1.25rem; }

/* home */
.next {
	background: var(--surface); border-radius: 14px; padding: 1.1rem 1.2rem;
	display: grid; gap: .55rem; border: 1px solid var(--rule);
}
.next h2 { font-size: 1.45rem; }
.next .when { display: flex; flex-wrap: wrap; gap: .3rem 1rem; font-variant-numeric: tabular-nums; }
.next .when b { color: var(--accent); font-weight: 600; }
.btn {
	display: inline-flex; align-items: center; gap: .4rem; justify-self: start;
	border: 0; border-radius: 99px; padding: .55rem 1.05rem; cursor: pointer;
	background: var(--accent); color: var(--accent-ink); font-weight: 500; text-decoration: none;
}
.btn.quiet { background: var(--wash); color: var(--ink); }
.list { display: grid; gap: 0; border-top: 1px solid var(--rule); }
.row {
	display: grid; grid-template-columns: 4.6rem 1fr auto; align-items: center; gap: .9rem;
	padding: .8rem 0; border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; cursor: pointer; width: 100%;
}
.row:disabled { cursor: default; }
.row .dv { font-family: var(--f-sa); font-size: 1.05rem; color: var(--accent); line-height: 1.2; }
.row .t { min-width: 0; }
.row .t b { display: block; font-weight: 600; }
.row .t small { color: var(--ink-2); font-size: .85rem; }
.pill { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; padding: .15rem .55rem; border-radius: 99px; background: var(--wash); color: var(--ink-2); white-space: nowrap; }
.pill.ready { background: var(--accent); color: var(--accent-ink); }
.row:disabled .dv { color: var(--ink-2); }

/* festival */
.hero { display: grid; gap: .35rem; }
.hero .dv { font-family: var(--f-sa); font-size: clamp(2rem, 7vw, 2.8rem); color: var(--accent); line-height: 1.15; }
.hero h1 { font-size: 1.5rem; }
.lede { max-width: 62ch; }
.facts { display: grid; grid-template-columns: minmax(9rem, auto) 1fr; gap: .35rem 1rem; margin: 0; font-size: .95rem; }
.facts dt { color: var(--ink-2); }
.facts dd { margin: 0; font-variant-numeric: tabular-nums; }
.src { font-size: .78rem; color: var(--ink-2); }
.choose { display: grid; gap: .45rem; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip { border: 1px solid var(--rule); background: none; border-radius: 99px; padding: .35rem .8rem; cursor: pointer; font-size: .9rem; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip-note { font-size: .85rem; color: var(--ink-2); }

.strip { display: flex; gap: .45rem; overflow-x: auto; padding: .2rem .1rem .5rem; scroll-snap-type: x proximity; }
.day {
	flex: 0 0 auto; width: 4.4rem; scroll-snap-align: start;
	display: grid; justify-items: center; gap: .15rem; padding: .5rem .2rem .45rem;
	border: 1px solid var(--rule); border-radius: 12px; background: none; cursor: pointer;
}
.day[aria-pressed="true"] { border-color: var(--accent); background: var(--wash); }
.day.gone { opacity: .45; }
.day small { font-size: .68rem; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
.day b { font-size: 1.15rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.ring { width: 22px; height: 22px; }
.ring circle { fill: none; stroke-width: 3; }
.ring .bg { stroke: var(--rule); }
.ring .fg { stroke: var(--durva); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }

.today { display: grid; gap: .8rem; }
.today h2 { font-size: 1.3rem; }
.today .tithi { color: var(--accent); font-weight: 500; }
.notice { border-left: 3px solid var(--accent); padding: .55rem .85rem; background: var(--surface); border-radius: 0 10px 10px 0; display: grid; gap: .4rem; }
.notice .sa { font-size: 1.15rem; line-height: 1.6; white-space: pre-line; }

.check { display: grid; border-top: 1px solid var(--rule); }
.task { display: grid; grid-template-columns: 2.2rem 1fr; gap: .2rem .7rem; padding: .75rem 0; border-bottom: 1px solid var(--rule); }
.tick {
	width: 1.9rem; height: 1.9rem; border-radius: 50%; border: 2px solid var(--bead); background: none; cursor: pointer;
	display: grid; place-items: center; padding: 0;
}
.tick svg { width: 1rem; height: 1rem; stroke: var(--accent-ink); stroke-width: 3; fill: none; opacity: 0; }
.tick[aria-checked="true"] { background: var(--durva); border-color: var(--durva); }
.tick[aria-checked="true"] svg { opacity: 1; stroke: var(--paper); }
.task .body { min-width: 0; display: grid; gap: .15rem; }
.task .time { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.task .title { font-weight: 600; }
.task.done .title { color: var(--ink-2); }
.task .detail { font-size: .92rem; color: var(--ink-2); }
.task .acts { display: flex; flex-wrap: wrap; gap: .5rem; padding-top: .25rem; }
.link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-weight: 500; font-size: .9rem; text-decoration: underline; text-underline-offset: 3px; }
.meter { font-size: .85rem; font-variant-numeric: tabular-nums; color: var(--durva); font-weight: 500; }

details.fold { border-top: 1px solid var(--rule); padding: .7rem 0; }
details.fold:last-of-type { border-bottom: 1px solid var(--rule); }
details.fold summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 1rem; }
details.fold summary::-webkit-details-marker { display: none; }
details.fold summary::after { content: "+"; color: var(--ink-2); font-weight: 400; }
details.fold[open] summary::after { content: "–"; }
details.fold > div { padding-top: .7rem; display: grid; gap: .6rem; }
.kv { display: grid; grid-template-columns: minmax(7rem, 11rem) 1fr; gap: .4rem 1rem; font-size: .93rem; }
.kv b { font-weight: 500; }
ol.steps { margin: 0; padding-left: 1.4rem; columns: 2 13rem; column-gap: 2rem; font-size: .93rem; }
.texts { display: grid; gap: .4rem; }

/* sankashti dates */
.dates { display: grid; gap: .45rem; }
.date-btn { display: grid; grid-template-columns: 5.2rem 1fr auto; gap: .8rem; align-items: center; text-align: left; border: 1px solid var(--rule); border-radius: 12px; padding: .6rem .8rem; background: none; cursor: pointer; }
.date-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--wash); }
.date-btn b { font-variant-numeric: tabular-nums; }
.date-btn small { color: var(--ink-2); display: block; font-size: .82rem; }

/* reader */
.script-tog { display: flex; gap: .3rem; }
.text-body { display: grid; gap: 1.1rem; }
.verse { display: grid; gap: .25rem; }
.verse .sa, .verse .mr { font-size: 1.2rem; line-height: 1.75; white-space: pre-line; }
.verse .lat { font-size: 1rem; color: var(--ink-2); white-space: pre-line; font-style: italic; }
.verse h3 { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; padding-top: .4rem; }
.mean { font-size: .95rem; max-width: 62ch; }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: .1rem 1.5rem; counter-reset: n; }
.names li { list-style: none; display: grid; grid-template-columns: 1.8rem 1fr; padding: .25rem 0; border-bottom: 1px solid var(--rule); }
.names li::before { counter-increment: n; content: counter(n); color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: .85rem; padding-top: .2rem; }
.names .sa { font-size: 1.1rem; }
.names .lat { font-size: .85rem; color: var(--ink-2); grid-column: 2; font-style: italic; }
body[data-script="deva"] .lat:not(.keep) { display: none; }
body[data-script="iast"] .verse .sa, body[data-script="iast"] .verse .mr, body[data-script="iast"] .names .sa { display: none; }
body[data-script="iast"] .verse .lat, body[data-script="iast"] .names .lat { color: var(--ink); font-style: normal; font-size: 1.1rem; }

/* deities */
.gods { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: .6rem; }
.god { display: grid; gap: .1rem; text-align: left; padding: .8rem .9rem; border: 1px solid var(--rule); border-radius: 12px; background: none; cursor: pointer; }
.god .dv { font-family: var(--f-sa); font-size: 1.3rem; color: var(--accent); line-height: 1.25; }
.god small { color: var(--ink-2); font-size: .8rem; }
.mantra { display: grid; gap: .35rem; padding: 1rem 0; border-bottom: 1px solid var(--rule); }
.mantra:first-of-type { border-top: 1px solid var(--rule); }
.mantra .sa { font-size: 1.3rem; line-height: 1.7; white-space: pre-line; }
.mantra .lat { font-size: .98rem; color: var(--ink-2); font-style: italic; white-space: pre-line; }
.mantra .meta { display: flex; flex-wrap: wrap; gap: .3rem 1rem; align-items: center; font-size: .85rem; color: var(--ink-2); }

/* japa sheet */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--paper); display: grid; grid-template-rows: auto 1fr auto; padding: calc(env(safe-area-inset-top, 0px) + .8rem) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 1rem) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; max-width: 42rem; width: 100%; margin: 0 auto; }
.sheet-mid { display: grid; place-content: center; justify-items: center; gap: 1.2rem; text-align: center; min-height: 0; overflow: auto; }
.sheet .sa { font-size: clamp(1.4rem, 5vw, 2rem); line-height: 1.6; white-space: pre-line; max-width: 30ch; }
.sheet .lat { color: var(--ink-2); font-style: italic; white-space: pre-line; }
.mala-btn { position: relative; width: min(64vw, 15rem); aspect-ratio: 1; max-width: 100%; border: 0; background: none; cursor: pointer; padding: 0; border-radius: 50%; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.mala-btn svg { width: 100%; height: 100%; display: block; }
.mala-btn .bead { fill: var(--bead); transition: fill .12s; }
.mala-btn .bead.on { fill: var(--accent); }
.mala-btn .meru { fill: var(--durva); }
.mala-btn .core { fill: var(--surface); stroke: var(--rule); }
.mala-btn:active .core { fill: var(--wash); }
.mala-num { position: absolute; inset: 0; display: grid; place-content: center; pointer-events: none; }
.mala-num b { font-size: 2.6rem; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.mala-num small { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin-top: .3rem; }
.sheet-foot { display: flex; justify-content: center; flex-wrap: wrap; gap: .6rem 1.4rem; font-size: .9rem; color: var(--ink-2); font-variant-numeric: tabular-nums; align-items: center; }
.sheet-foot b { color: var(--durva); }
.close { border: 1px solid var(--rule); background: none; border-radius: 99px; padding: .35rem .9rem; cursor: pointer; }

.foot { font-size: .8rem; color: var(--ink-2); display: grid; gap: .3rem; border-top: 1px solid var(--rule); padding-top: 1rem; }
.back { justify-self: start; }

@media (max-width: 30rem) {
	.brand span { display: none; }
	.facts, .kv { grid-template-columns: 1fr; gap: .1rem; }
	.facts dd, .kv span { padding-bottom: .4rem; }
	.row { grid-template-columns: 3.6rem 1fr auto; gap: .6rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<header class="top">
	<div class="top-in">
		<button class="brand" id="home-btn" aria-label="Utsav Sadhana, home"><b>उत्सव साधना</b><span>Utsav Sadhana</span></button>
		<nav class="tabs" aria-label="Sections">
			<button class="tab" id="tab-home" data-go="">Festivals</button>
			<button class="tab" id="tab-mantra" data-go="mantras">Mantras</button>
		</nav>
	</div>
	<p class="sync" id="sync">Your progress stays in this browser.</p>
</header>
<main id="main" class="col" tabindex="-1"></main>

<div class="sheet" id="japa" hidden role="dialog" aria-modal="true" aria-labelledby="japa-name">
	<div class="sheet-top">
		<span class="eyebrow" id="japa-name">Japa</span>
		<button class="close" id="japa-close">Done</button>
	</div>
	<div class="sheet-mid">
		<p class="sa" id="japa-deva"></p>
		<p class="lat" id="japa-iast"></p>
		<button class="mala-btn" id="mala" aria-label="Count one repetition">
			<svg viewBox="0 0 132 132" aria-hidden="true" id="mala-svg"></svg>
			<span class="mala-num"><b id="mala-n">0</b><small>of 108</small></span>
		</button>
	</div>
	<div class="sheet-foot">
		<span id="japa-today"></span>
		<span id="japa-total"></span>
		<button class="link" id="mala-undo">Undo one</button>
	</div>
</div>

<script>
/* Hand-written content for Utsav Sadhana. Long texts (Atharvashirsha, Sankatanashana stotram,
   Sukhakarta aarti, the 21 names) are not here: tools/build.mjs reads them verbatim from sources/
   and adds them as TEXTS. IAST is generated in the page from the Devanagari.

   A festival is data: add one to FESTIVALS (with its deity's mantras in DEITIES) and the app
   shows it. Dates are for Pune, from Drik Panchang (checked 16 Oct 2026). */

const DEITIES = [
	{
		id: "ganesha", name: "Ganesha", deva: "श्रीगणेश", day: "Wednesday, and every Chaturthi",
		about: "Remover of obstacles, worshipped first before any undertaking.",
		mantras: [
			{ id: "gam", name: "Mula mantra", deva: "ॐ गं गणपतये नमः", mean: "Om, salutations to Ganapati. 'Gam' is his seed syllable; the Atharvashirsha (verse 7) builds this mantra letter by letter.", count: 108, src: "Ganapati Atharvashirsha 7" },
			{ id: "vakratunda", name: "Vakratunda shloka", deva: "वक्रतुण्ड महाकाय सूर्यकोटिसमप्रभ ।\nनिर्विघ्नं कुरु मे देव सर्वकार्येषु सर्वदा ॥", mean: "O curved-trunked one of great body, bright as a crore suns: make all my work free of obstacles, always.", count: 11, src: "Ganesha Pratah-smaranam (sanskritdocuments.org)" },
			{ id: "gayatri", name: "Ganesha Gayatri", deva: "एकदंताय विद्महे । वक्रतुण्डाय धीमहि ॥\nतन्नो दंतिः प्रचोदयात् ॥", mean: "We know the single-tusked one; we meditate on the curved-trunked one. May the tusked one inspire us.", count: 108, src: "Ganapati Atharvashirsha 8" },
			{ id: "shuklambara", name: "Dhyana shloka", deva: "शुक्लाम्बरधरं विष्णुं शशिवर्णं चतुर्भुजम् ।\nप्रसन्नवदनं ध्यायेत् सर्वविघ्नोपशान्तये ॥", mean: "Meditate on the all-pervading one clad in white, moon-coloured, four-armed, with a gracious face, so that every obstacle is calmed. Said before any puja or study.", count: 3, src: "Ganesha Dvadashanama stotram 1; also opens the Vishnu Sahasranama" },
			{ id: "abhipsita", name: "Before any work", deva: "अभीप्सितार्थसिद्ध्यर्थं पूजितो यः सुरासुरैः ।\nसर्वविघ्नहरस्तस्मै गणाधिपतये नमः ॥", mean: "Salutations to the lord of the ganas, remover of all obstacles, whom gods and asuras worship to gain what they seek.", count: 3, src: "Ganesha Pratah-smaranam (sanskritdocuments.org)" },
		],
	},
	{
		id: "shiva", name: "Shiva", deva: "शिव", day: "Monday, Pradosh, Maha Shivaratri",
		about: "The auspicious one; destroyer of ignorance, lord of yogis.",
		mantras: [
			{ id: "panchakshari", name: "Panchakshari", deva: "ॐ नमः शिवाय", mean: "Om, salutations to Shiva. The five-syllable mantra of the Yajurveda's Shri Rudram.", count: 108, src: "Shri Rudram, Namakam 8 (Taittiriya Samhita 4.5.8)" },
			{ id: "mrityunjaya", name: "Mahamrityunjaya", deva: "ॐ त्र्यम्बकं यजामहे सुगन्धिं पुष्टिवर्धनम् ।\nउर्वारुकमिव बन्धनान्मृत्योर्मुक्षीय मामृतात् ॥", mean: "We worship the three-eyed one, fragrant, who makes us flourish. As a ripe cucumber falls free of its vine, may he free us from death, not from immortality. Chanted for health and protection.", count: 108, src: "Rigveda 7.59.12" },
		],

nFirst, as the one with the twisted trunk;\nSecondly, as the one with the single tusk.\nThirdly, as the one with dark brown eyes;\nFourthly, as the one with the elephant's mouth.\nFifthly, as the one with the belly like a pot;\nSixtly, as the grotesque one.\nSeventhly, as the king of obstacles;\nEighthly, as the smoke-colored one.\nNinthly, as the moon-crested one;\nTenthly, as the remover of obstacles.\nEleventhly, as the lord of all,\nTwelfthly, as the elephant-faced one.\nWhoever repeats these twelve names at dawn, noon and sunset, there is no fear of failure, nay, constant fortune.\nHe who desires wisdom, obtains wisdom; he who desires wealth, obtains wealth.\nHe who desires sons, obtains sons; he who desires liberation attains liberation.\nWhoever chants this hymn to Ganapati reaches him in six months, and in one year he reaches perfection, there is no doubt about this.\nWhoever makes copies of this and distributes them to eight Brahmana, he reaches wisdom immediately (all knowledge will be his), due to the grace of Ganesha.","src":"sanskritdocuments.org, ganesha8","url":"https://sanskritdocuments.org/doc_ganesha/ganesha8.html","credit":"Translation as given in the source. It notes that 'bhaktāvāsaṃ' (verse 1) varies between prints."},"aarti":{"title":"Sukhakarta Dukhaharta","short":"the aarti","deva":"सुखकर्ता दुखहर्ता","lang":"mr","about":"Samarth Ramdas's Marathi aarti, sung first at every Ganesha aarti in Maharashtra. The refrain (धृ) follows each stanza.","blocks":[{"lines":["सुखकर्ता दुखहर्ता, वार्ता विघ्नांची।","नुरवी; पुरवी प्रेम, कृपा जयाची।","सर्वांगी सुंदर, उटी शेंदुराची।","कंठी झळके माळ, मुक्ताफळांची॥१॥"]},{"lines":["जय देव, जय देव जय मंगलमूर्ती।","दर्शनमात्रे मन कामना पुरती ॥धृ॥"]},{"lines":["रत्नखचित फरा, तुज गौरीकुमरा।","चंदनाची उटी, कुमकुम केशरा।","हिरेजडित मुकुट, शोभतो बरा।","रुणझुणती नूपुरे, चरणी घागरिया।","जय देव जय देव जय मंगलमूर्ती ॥२॥"]},{"lines":["लंबोदर पीतांबर, फणिवरबंधना।","सरळ सोंड, वक्रतुंड त्रिनयना।","दास रामाचा, वाट पाहे सदना।","संकटी पावावे, निर्वाणी रक्षावे, सुरवरवंदना।","जय देव जय देव, जय मंगलमूर्ती।","दर्शनमात्रे मनकामना पुरती ॥३॥"]}],"mean":"1. Bringer of joy, remover of sorrow, whose grace leaves no trace of obstacles and fills us with love. Beautiful in every limb, smeared with sindoor, a pearl necklace shining at his throat.\nRefrain: Victory, victory to the auspicious one; the mere sight of you fulfils the mind's wishes.\n2. A jewelled ornament for you, son of Gauri; sandal paste, kumkum and saffron; a diamond-studded crown that suits you well; anklets jingling at your feet.\n3. Big-bellied, in yellow silk, with the king of serpents as a belt; straight trunk, curved face, three eyes. Rama's servant waits for you at home: come to us in trouble, protect us at the end, you whom the gods worship.","src":"Wikipedia, Sukhakarta Dukhaharta","url":"https://en.wikipedia.org/wiki/Sukhakarta_Dukhaharta","credit":"Checked against Marathi Wikipedia, which reads पूर्ती for पुरती in the refrain. Meaning is our summary."},"names21":{"title":"21 names for the durva offering","short":"the 21 names","deva":"महागणपत्येकविंशतिनामावलिः","lang":"sa","about":"Offer one blade of durva (or a pair) with each name. Twenty-one is Ganesha's number: 21 durva, 21 modak.","names":["ॐ गणञ्जाय नमः","ॐ गणपतये नमः","ॐ हेरम्बाय नमः","ॐ धरणीधराय नमः","ॐ महागणपतये नमः","ॐ लक्षप्रदाय नमः","ॐ क्षिप्रप्रसादनाय नमः","ॐ अमोघसिद्धये नमः","ॐ अमिताय नमः","ॐ मन्त्राय नमः","ॐ चिन्तामणये नमः","ॐ निधये नमः","ॐ सुमङ्गलाय नमः","ॐ बीजाय नमः","ॐ आशापूरकाय नमः","ॐ वरदाय नमः","ॐ शिवाय नमः","ॐ काश्यपाय नमः","ॐ नन्दनाय नमः","ॐ वाचासिद्धाय नमः","ॐ ढुण्ढिर्विनायकाय नमः"],"src":"sanskritdocuments.org, Mahaganapati Ekavimshati Namavali","url":"https://sanskritdocuments.org/doc_ganesha/mahAgaNapatyekaviMshatinAmAvalI.html"},"ramaraksha":{"title":"Shri Ramaraksha Stotram","short":"Ramaraksha","deva":"श्रीरामरक्षास्तोत्रम्","lang":"sa","about":"Budha Kaushika's shield of Rama's names: viniyoga, dhyana and 38 verses. Recited daily through Chaitra Navratri.","blocks":[{"lines":["अस्य श्रीरामरक्षास्तोत्रमन्त्रस्य । बुधकौशिक ऋषिः ।","श्रीसीतारामचन्द्रो देवता । अनुष्टुप् छन्दः ।","सीता शक्तिः । श्रीमद् हनुमान कीलकम् ।","श्रीरामचन्द्रप्रीत्यर्थे रामरक्षास्तोत्रजपे विनियोगः ॥","अथ ध्यानम् ।","ध्यायेदाजानुबाहुं धृतशरधनुषं बद्धपद्मासनस्थं","पीतं वासो वसानं नवकमलदलस्पर्धिनेत्रं प्रसन्नम् ।","वामाङ्कारूढ सीतामुखकमलमिलल्लोचनं नीरदाभं","नानालङ्कारदीप्तं दधतमुरुजटामण्डनं रामचन्द्रम् ॥","इति ध्यानम् ॥","चरितं रघुनाथस्य शतकोटि प्रविस्तरम् ।","एकैकमक्षरं पुंसां महापातकनाशनम् ॥ १॥"]},{"lines":["ध्यात्वा नीलोत्पलश्यामं रामं राजीवलोचनम् ।","जानकीलक्ष्मणोपेतं जटामुकुटमण्डितम् ॥ २॥"]},{"lines":["सासितूणधनुर्बाणपाणिं नक्तञ्चरान्तकम् ।","स्वलीलया जगत्त्रातुमाविर्भूतमजं विभुम् ॥ ३॥"]},{"lines":["रामरक्षां पठेत्प्राज्ञः पापघ्नीं सर्वकामदाम् ।","शिरो मे राघवः पातु भालं दशरथात्मजः ॥ ४॥"]},{"lines":["कौसल्येयो दृशौ पातु विश्वामित्रप्रियः श्रुती ।","घ्राणं पातु मखत्राता मुखं सौमित्रिवत्सलः ॥ ५॥"]},{"lines":["जिह्वां विद्यानिधिः पातु कण्ठं भरतवन्दितः ।","स्कन्धौ दिव्यायुधः पातु भुजौ भग्नेशकार्मुकः ॥ ६॥"]},{"lines":["करौ सीतापतिः पातु हृदयं जामदग्न्यजित् ।","मध्यं पातु खरध्वंसी नाभिं जाम्बवदाश्रयः ॥ ७॥"]},{"lines":["सुग्रीवेशः कटी पातु सक्थिनी हनुमत्प्रभुः ।","ऊरू रघूत्तमः पातु रक्षःकुलविनाशकृत् ॥ ८॥"]},{"lines":["जानुनी सेतुकृत्पातु जङ्घे दशमुखान्तकः ।","पादौ बिभीषणश्रीदः पातु रामोऽखिलं वपुः ॥ ९॥"]},{"lines":["एतां रामबलोपेतां रक्षां यः सुकृती पठेत् ।","स चिरायुः सुखी पुत्री विजयी विनयी भवेत् ॥ १०॥"]},{"lines":["पातालभूतलव्योमचारिणश्छद्मचारिणः ।","न द्रष्टुमपि शक्तास्ते रक्षितं रामनामभिः ॥ ११॥"]},{"lines":["रामेति रामभद्रेति रामचन्द्रेति वा स्मरन् ।","नरो न लिप्यते पापैः भुक्तिं मुक्तिं च विन्दति ॥ १२॥"]},{"lines":["जगज्जैत्रैकमन्त्रेण रामनाम्नाभिरक्षितम् ।","यः कण्ठे धारयेत्तस्य करस्थाः सर्वसिद्धयः ॥ १३॥"]},{"lines":["वज्रपञ्जरनामेदं यो रामकवचं स्मरेत् ।","अव्याहताज्ञः सर्वत्र लभते जयमङ्गलम् ॥ १४॥"]},{"lines":["आदिष्टवान् यथा स्वप्ने रामरक्षामिमां हरः ।","तथा लिखितवान् प्रातः प्रबुद्धो बुधकौशिकः ॥ १५॥"]},{"lines":["आरामः कल्पवृक्षाणां विरामः सकलापदाम् ।","अभिरामस्त्रिलोकानां रामः श्रीमान् स नः प्रभुः ॥ १६॥"]},{"lines":["तरुणौ रूपसम्पन्नौ सुकुमारौ महाबलौ ।","पुण्डरीकविशालाक्षौ चीरकृष्णाजिनाम्बरौ ॥ १७॥"]},{"lines":["फलमूलाशिनौ दान्तौ तापसौ ब्रह्मचारिणौ ।","पुत्रौ दशरथस्यैतौ भ्रातरौ रामलक्ष्मणौ ॥ १८॥"]},{"lines":["शरण्यौ सर्वसत्त्वानां श्रेष्ठौ सर्वधनुष्मताम् ।","रक्षः कुलनिहन्तारौ त्रायेतां नो रघूत्तमौ ॥ १९॥"]},{"lines":["आत्तसज्जधनुषाविषुस्पृशावक्षयाशुगनिषङ्गसङ्गिनौ ।","रक्षणाय मम रामलक्ष्मणावग्रतः पथि सदैव गच्छताम् ॥ २०॥"]},{"lines":["सन्नद्धः कवची खड्गी चापबाणधरो युवा ।","गच्छन्मनोरथोऽस्माकं रामः पातु सलक्ष्मणः ॥ २१॥"]},{"lines":["रामो दाशरथिः शूरो लक्ष्मणानुचरो बली ।","काकुत्स्थः पुरुषः पूर्णः कौसल्येयो रघूत्तमः ॥ २२॥"]},{"lines":["वेदान्तवेद्यो यज्ञेशः पुराणपुरुषोत्तमः ।","जानकीवल्लभः श्रीमान् अप्रमेय पराक्रमः ॥ २३॥"]},{"lines":["इत्येतानि जपन्नित्यं मद्भक्तः श्रद्धयान्वितः ।","अश्वमेधाधिकं पुण्यं सम्प्राप्नोति न संशयः ॥ २४॥"]},{"lines":["रामं दूर्वादलश्यामं पद्माक्षं पीतवाससम् ।","स्तुवन्ति नामभिर्दिव्यैः न ते संसारिणो नराः ॥ २५॥"]},{"lines":["रामं लक्ष्मणपूर्वजं रघुवरं सीतापतिं सुन्दरम् ।","काकुत्स्थं करुणार्णवं गुणनिधिं विप्रप्रियं धार्मिकम् ।","राजेन्द्रं सत्यसन्धं दशरथतनयं श्यामलं शान्तमूर्तिम् ।","वन्दे लोकाभिरामं रघुकुलतिलकं राघवं रावणारिम् ॥ २६॥"]},{"lines":["रामाय रामभद्राय रामचन्द्राय वेधसे ।","रघुनाथाय नाथाय सीतायाः पतये नमः ॥ २७॥"]},{"lines":["श्रीराम राम रघुनन्दन राम राम","श्रीराम राम भरताग्रज राम राम ।","श्रीराम राम रणकर्कश राम राम","श्रीराम राम शरणं भव राम राम ॥ २८॥"]},{"lines":["श्रीरामचन्द्रचरणौ मनसा स्मरामि","श्रीरामचन्द्रचरणौ वचसा गृणामि ।","श्रीरामचन्द्रचरणौ शिरसा नमामि","श्रीरामचन्द्रचरणौ शरणं प्रपद्ये ॥ २९॥"]},{"lines":["माता रामो मत्पिता रामचन्द्रः","स्वामी रामो मत्सखा रामचन्द्रः ।","सर्वस्वं मे रामचन्द्रो दयालु-","र्नान्यं जाने नैव जाने न जाने ॥ ३०॥"]},{"lines":["दक्षिणे लक्ष्मणो यस्य वामे तु जनकात्मजा ।","पुरतो मारुतिर्यस्य तं वन्दे रघुनन्दनम् ॥ ३१॥"]},{"lines":["लोकाभिरामं रणरङ्गधीरं","राजीवनेत्रं रघुवंशनाथम् ।","कारुण्यरूपं करुणाकरं तं","श्रीरामचन्द्रम् शरणं प्रपद्ये ॥ ३२॥"]},{"lines":["मनोजवं मारुततुल्यवेगं","जितेन्द्रियं बुद्धिमतां वरिष्ठम् ।","वातात्मजं वानरयूथमुख्यं","श्रीरामदूतं शरणं प्रपद्ये ॥ ३३॥"]},{"lines":["कूजन्तं रामरामेति मधुरं मधुराक्षरम् ।","आरुह्य कविताशाखां वन्दे वाल्मीकिकोकिलम् ॥ ३४॥"]},{"lines":["आपदामपहर्तारं दातारं सर्वसम्पदाम् ।","लोकाभिरामं श्रीरामं भूयो भूयो नमाम्यहम् ॥ ३५॥"]},{"lines":["भर्जनं भवबीजानामर्जनं सुखसम्पदाम् ।","तर्जनं यमदूतानां रामरामेति गर्जनम् ॥ ३६॥"]},{"lines":["रामो राजमणिः सदा विजयते रामं रमेशं भजे","रामेणाभिहता निशाचरचमू रामाय तस्मै नमः ।","रामान्नास्ति परायणं परतरं रामस्य दासोऽस्म्यहं","रामे चित्तलयः सदा भवतु मे भो राम मामुद्धर ॥ ३७॥"]},{"lines":["रामरामेति रामेति रमे रामे मनोरमे । (श्रीरामरामरामेति)","सहस्रनामतत्तुल्यं रामनाम वरानने ॥ ३८॥"]},{"lines":["इति श्रीबुधकौशिकविरचितं श्रीरामरक्षास्तोत्रं सम्पूर्णम् ॥"]}],"src":"sanskritdocuments.org, rraksha","url":"https://sanskritdocuments.org/doc_raama/rraksha.html"},"chalisa":{"title":"Shri Hanuman Chalisa","short":"Hanuman Chalisa","deva":"श्रीहनुमान चालीसा","lang":"hi","about":"Tulasidasa's forty chaupais in Awadhi, between the opening and closing dohas.","blocks":[{"head":"दोहा"},{"lines":["श्रीगुरु चरन सरोज रज निज मनु मुकुरु सुधारि ।","बरनऊँ रघुबर बिमल जसु जो दायकु फल चारि ॥"]},{"lines":["बुद्धिहीन तनु जानिके सुमिरौं पवनकुमार ।","बल बुद्धि बिद्या देहु मोहिं हरहु कलेस बिकार ॥"]},{"head":"चौपाई"},{"lines":["जय हनुमान ज्ञान गुन सागर ।","जय कपीस तिहुँ लोक उजागर ॥"]},{"lines":["राम दूत अतुलित बल धामा ।","अंजनिपुत्र पवनसुत नामा ॥"]},{"lines":["महाबीर बिक्रम बजरंगी ।","कुमति निवार सुमति के संगी ॥"]},{"lines":["कंचन बरन बिराज सुबेसा ।","कानन कुंडल कुंचित केसा ॥"]},{"lines":["हाथ बज्र औ ध्वजा बिराजै ।","काँधे मूँज जनेऊ साजै ॥"]},{"lines":["संकर सुवन केसरीनंदन ।","तेज प्रताप महा जग बंदन ॥"]},{"lines":["विद्यावान गुनी अति चातुर ।","राम काज करिबे को आतुर ॥"]},{"lines":["प्रभु चरित्र सुनिबे को रसिया ।","राम लखन सीता मन बसिया ॥"]},{"lines":["सूक्ष्म रूप धरि सियहिं दिखावा ।","बिकट रूप धरि लंक जरावा ॥"]},{"lines":["भीम रूप धरि असुर सँहारे ।","रामचंद्र /* Devanagari to IAST. For Hindi (the Chalisa) it follows ISO 15919 where IAST
   has no letter: ड़ = ṛ, ढ़ = ṛh, so the vowel ऋ becomes r̥. The inherent "a"
   is written wherever the Devanagari has it (no schwa deletion). */
const deva2iast = (function () {
	const CONS = { "क": "k", "ख": "kh", "ग": "g", "घ": "gh", "ङ": "ṅ", "च": "c", "छ": "ch", "ज": "j", "झ": "jh", "ञ": "ñ",
		"ट": "ṭ", "ठ": "ṭh", "ड": "ḍ", "ढ": "ḍh", "ण": "ṇ", "त": "t", "थ": "th", "द": "d", "ध": "dh", "न": "n",
		"प": "p", "फ": "ph", "ब": "b", "भ": "bh", "म": "m", "य": "y", "र": "r", "ल": "l", "ळ": "ḷ", "व": "v",
		"श": "ś", "ष": "ṣ", "स": "s", "ह": "h" };
	const NUKTA = { "क": "q", "ख": "k͟h", "ग": "ġ", "ज": "z", "ड": "ṛ", "ढ": "ṛh", "फ": "f", "य": "ẏ" };
	const VOW = { "अ": "a", "आ": "ā", "इ": "i", "ई": "ī", "उ": "u", "ऊ": "ū", "ऋ": "ṛ", "ॠ": "ṝ", "ऌ": "ḷ", "ॡ": "ḹ",
		"ए": "e", "ऐ": "ai", "ओ": "o", "औ": "au", "ऍ": "ê", "ऑ": "ô" };
	const MAT = { "ा": "ā", "ि": "i", "ी": "ī", "ु": "u", "ू": "ū", "ृ": "ṛ", "ॄ": "ṝ", "ॢ": "ḷ", "ॣ": "ḹ",
		"े": "e", "ै": "ai", "ो": "o", "ौ": "au", "ॅ": "ê", "ॉ": "ô" };
	const SIGN = { "ं": "ṃ", "ः": "ḥ", "ँ": "m̐", "ऽ": "’", "ॐ": "oṃ", "।": "|", "॥": "||",
		"०": "0", "१": "1", "२": "2", "३": "3", "४": "4", "५": "5", "६": "6", "७": "7", "८": "8", "९": "9" };
	const SKIP = /[‌‍᳐-᳿॒॑]/;
	return function (input, hindi) {
		const s = input.normalize("NFC");
		let out = "";
		let pending = false; // a consonant waits for its vowel
		let last = null;     // last consonant letter, for nukta
		for (const ch of s) {
			if (SKIP.test(ch)) continue;
			if (ch === "़") { // nukta
				if (last && NUKTA[last]) out = out.slice(0, out.length - CONS[last].length) + NUKTA[last];
				last = null;
				continue;
			}
			if (CONS[ch]) {
				if (pending) out += "a";
				out += CONS[ch];
				pending = true;
				last = ch;
				continue;
			}
			last = null;
			if (MAT[ch] !== undefined) {
				out += (hindi && ch === "ृ") ? "r̥" : MAT[ch];
				pending = false;
				continue;
			}
			if (ch === "्") { pending = false; continue; } // virama
			if (pending) {
				out += "a";
				pending = false;
				// a + independent i/u inside a word would read as the diphthong; mark the hiatus
				if (ch === "इ") { out += "ï"; continue; }
				if (ch === "उ") { out += "ü"; continue; }
			}
			if (VOW[ch] !== undefined) out += (hindi && ch === "ऋ") ? "r̥" : VOW[ch];
			else if (SIGN[ch] !== undefined) out += SIGN[ch];
			else out += ch;
		}
		if (pending) out += "a";
		return out;
	};
})();

			$("sync").textContent = "Your progress is saved to your Claude account, privately.";
			save();
			render();
		} catch (e) { /* stay local */ }
	})();

	/* ---------- lookups ---------- */
	const FEST = Object.fromEntries(FESTIVALS.map((f) => [f.id, f]));
	const GOD = Object.fromEntries(DEITIES.map((d) => [d.id, d]));
	const mantraOf = (ref) => { const [g, m] = ref.split("/"); return GOD[g].mantras.find((x) => x.id === m); };
	const planOf = (f) => (state.plan[f.id] = Object.assign({ days: f.durations ? f.durations[f.durations.length - 1].days : 1, malas: 1 }, state.plan[f.id] || {}));
	const doneKey = (f, iso, t) => f.id + ":" + iso + ":" + t;
	const japaOf = (ref) => (state.japa[ref] = Object.assign({ total: 0, n: 0, byDay: {} }, state.japa[ref] || {}));
	const japaOn = (ref, iso) => (japaOf(ref).byDay[iso] || 0);

	/* the days a festival plan covers, given the chosen duration */
	function planDays(f) {
		if (f.monthly) return f.dates.map((d) => ({ date: d.date, title: d.name + " Sankashti", tithi: "Moonrise " + d.moon, focus: d.note || "" }));
		if (!f.durations) return f.days;
		const n = Math.ceil(planOf(f).days);
		return f.days.slice(0, Math.max(2, n));
	}
	function dayProgress(f, iso) {
		const items = f.core;
		let n = 0;
		for (const t of items) if (state.done[doneKey(f, iso, t.id)]) n++;
		return n / items.length;
	}
	function nextObservance() {
		const t = todayIso();
		const all = [];
		for (const f of FESTIVALS) {
			if (f.status !== "ready") continue;
			if (f.monthly) f.dates.forEach((d) => all.push({ f, date: d.date, end: d.date, label: d.name + " Sankashti", extra: "Moonrise " + d.moon + " (Pune)" + (d.note ? ". " + d.note : "") }));
			else all.push({ f, date: f.start, end: f.end, label: f.name + " " + f.year, extra: fmt(f.start, { day: "numeric", month: "short" }) + " to " + fmt(f.end, { day: "numeric", month: "short" }) });
		}
		return all.filter((x) => x.end >= t).sort((a, b) => a.date.localeCompare(b.date));
	}

	/* ---------- views ---------- */
	function setTab(name) {
		$("tab-home").setAttribute("aria-current", name === "home" ? "page" : "false");
		$("tab-mantra").setAttribute("aria-current", name === "mantra" ? "page" : "false");
	}
	function ringSvg(p) {
		const c = 2 * Math.PI * 8;
		return '<svg class="ring" viewBox="0 0 22 22" aria-hidden="true"><circle class="bg" cx="11" cy="11" r="8"/><circle class="fg" cx="11" cy="11" r="8" stroke-dasharray="' + (c * p).toFixed(2) + " " + c.toFixed(2) + '"/></svg>';
	}

	function viewHome() {
		setTab("home");
		const up = nextObservance();
		let h = "";
		if (up.length) {
			const x = up[0];
			const d = daysTo(x.date);
			const live = x.date <= todayIso() && x.end >= todayIso();
			h += '<section class="next" aria-labelledby="next-h"><span class="eyebrow">' + (live ? "Happening now" : "Next observance") + '</span>' +
				'<h2 id="next-h">' + esc(x.label) + '</h2>' +
				'<p class="when"><b>' + esc(fmt(x.date, { weekday: "long", day: "numeric", month: "long", year: "numeric" })) + '</b><span>' + (live ? "today" : esc(inDays(d))) + '</span></p>' +
				'<p class="muted">' + esc(x.extra) + '</p>' +
				'<button class="btn" data-go="f/' + x.f.id + (x.f.monthly ? "/" + x.date : "") + '">Open the sadhana</button></section>';
			const later = up.find((y) => y.f.id !== x.f.id);
			if (later) h += '<p class="muted">Then <a href="#f/' + later.f.id + '" data-go="f/' + later.f.id + '">' + esc(later.label) + '</a>, ' + esc(inDays(daysTo(later.date))) + '.</p>';
		}
		h += '<section aria-labelledby="all-h" style="display:grid;gap:.6rem"><h2 id="all-h" class="eyebrow">Festivals</h2><div class="list">';
		// Every festival, soonest first by its next date (a monthly one by its next occurrence).
		const t0 = todayIso();
		const nextOf = (f) => f.monthly ? (f.dates.find((d) => d.date >= t0) || f.dates[f.dates.length - 1]).date : (f.end >= t0 ? f.start : "9" + f.start);
		const byDate = FESTIVALS.slice().sort((a, b) => nextOf(a).localeCompare(nextOf(b)));
		for (const f of byDate) {
			const ready = f.status === "ready";
			const when = f.monthly ? "Next " + fmt(nextOf(f), { day: "numeric", month: "short" }) : f.start ? fmt(f.start, { day: "numeric", month: "short", year: "numeric" }) : "";
			h += '<button class="row" ' + (ready ? 'data-go="f/' + f.id + '"' : "disabled") + '><span class="dv">' + esc(f.deva) + '</span><span class="t"><b>' + esc(f.name) + '</b><small>' + esc(when ? when + " · " : "") + esc(GOD[f.deity].name) + '</small></span><span class="pill' + (ready ? " ready" : "") + '">' + (ready ? "Open" : "Coming") + '</span></button>';
		}
		h += '</div></section>';
		h += footer();
		main.innerHTML = h;
	}

	function taskHtml(f, iso, t) {
		const k = doneKey(f, iso, t.id);
		const on = !!state.done[k];
		let acts = "";
		if (t.text) acts += '<button class="link" data-go="t/' + t.text + '">Read ' + esc(TEXTS[t.text].short) + '</button>';
		if (t.mantra && !t.japa) acts += '<button class="link" data-japa="' + t.mantra + '" data-iso="' + iso + '">Count on mala</button>';
		if (t.japa) {
			const target = planOf(f).malas * MALA;
			const got = japaOn(t.mantra, iso);
			acts += '<button class="link" data-japa="' + t.mantra + '" data-iso="' + iso + '" data-task="' + k + '" data-target="' + target + '">Start japa</button><span class="meter">' + got + " / " + target + '</span>';
		}
		return '<div class="task' + (on ? " done" : "") + '"><button class="tick" role="checkbox" aria-checked="' + on + '" data-tick="' + k + '" aria-label="' + esc(t.title) + '"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></button>' +
			'<div class="body"><span class="time">' + esc(t.time) + '</span><span class="title">' + esc(t.title) + '</span><span class="detail">' + esc(t.detail) + '</span>' + (acts ? '<span class="acts">' + acts + '</span>' : "") + '</div></div>';
	}

	function viewFestival(id, pick) {
		setTab("home");
		const f = FEST[id];
		if (!f || f.status !== "ready") return viewHome();
		const plan = planOf(f);
		const days = planDays(f);
		const t = todayIso();
		let sel = pick && days.find((d) => d.date === pick) ? pick : (days.find((d) => d.date === t) || days.find((d) => d.date > t) || days[0]).date;
		const day = days.find((d) => d.date === sel);
		let h = '<button class="link back" data-go="">← All festivals</button>';
		h += '<section class="hero"><span class="dv">' + esc(f.deva) + '</span><h1>' + esc(f.name) + (f.year ? " " + f.year : "") + '</h1><p class="muted">' + esc(f.sub) + '</p></section>';
		h += '<p class="lede">' + esc(f.intro) + '</p>';
		if (f.facts) h += '<section style="display:grid;gap:.4rem"><dl class="facts">' + f.facts.map(([k, v]) => "<dt>" + esc(k) + "</dt><dd>" + esc(v) + "</dd>").join("") + '</dl><p class="src">' + esc(f.factsSrc) + ". " + (f.start <= t && f.end >= t ? "Happening now" : esc(inDays(daysTo(f.start))).replace(/^./, (c) => c.toUpperCase())) + '.</p></section>';

		if (f.durations) {
			const cur = f.durations.find((d) => d.days === plan.days) || f.durations[f.durations.length - 1];
			h += '<section class="choose"><span class="eyebrow" id="dur-l">How long Ganpati stays</span><div class="chips" role="group" aria-labelledby="dur-l">' +
				f.durations.map((d) => '<button class="chip" aria-pressed="' + (d === cur) + '" data-days="' + d.days + '">' + esc(d.label) + '</button>').join("") + '</div><p class="chip-note">' + esc(cur.note) + '</p></section>';
		}
		h += '<section class="choose"><span class="eyebrow" id="mal-l">Daily japa</span><div class="chips" role="group" aria-labelledby="mal-l">' +
			[1, 3, 11].map((m) => '<button class="chip" aria-pressed="' + (plan.malas === m) + '" data-malas="' + m + '">' + m + (m === 1 ? " mala" : " malas") + " · " + (m * MALA) + '</button>').join("") + '</div></section>';

		if (f.monthly) {
			h += '<section class="dates" aria-label="Dates">' + f.dates.map((d) => '<button class="date-btn" aria-pressed="' + (d.date === sel) + '" data-day="' + d.date + '"><b>' + esc(fmt(d.date, { day: "numeric", month: "short" })) + '</b><span>' + esc(d.name) + '<small>' + esc(fmt(d.date, { weekday: "long" })) + (d.note ? " · " + esc(d.note) : "") + '</small></span><span class="meter">Moon ' + esc(d.moon) + '</span></button>').join("") + '</section><p class="src">' + esc(f.datesSrc) + '</p>';
		} else {
			h += '<div class="strip" role="group" aria-label="Days of the festival">' + days.map((d, i) => '<button class="day' + (d.date < t ? " gone" : "") + '" aria-pressed="' + (d.date === sel) + '" data-day="' + d.date + '" aria-label="Day ' + (i + 1) + ", " + esc(fmt(d.date, { weekday: "long", day: "numeric", month: "long" })) + '"><small>Day ' + (i + 1) + '</small><b>' + dateOf(d.date).getDate() + '</b><small>' + esc(fmt(d.date, { weekday: "short" })) + '</small>' + ringSvg(dayProgress(f, d.date)) + '</button>').join("") + '</div>';
		}

		h += '<section class="today" aria-labelledby="day-h"><div><span class="eyebrow">' + esc(fmt(day.date, { weekday: "long", day: "numeric", month: "long" })) + " · " + esc(inDays(daysTo(day.date))) + '</span><h2 id="day-h">' + esc(day.title) + ' <span class="tithi">' + esc(day.tithi) + '</span></h2></div>';
		if (day.focus) h += '<p>' + esc(day.focus) + '</p>';
		if (day.special && day.special.includes("moon") && f.moon) h += '<div class="notice"><b>If you see the moon by mistake</b><p class="muted">' + esc(f.moon.why) + '</p><p class="sa">' + esc(f.moon.deva) + '</p><p class="lat keep">' + esc(iast(f.moon.deva)) + '</p><p>' + esc(f.moon.mean) + '</p><p class="src">' + esc(f.moon.src) + '</p></div>';
		if (day.special && day.special.includes("shodasha")) h += '<details class="fold" open><summary>Shodashopachara: the sixteen offerings</summary><div><ol class="steps">' + f.shodasha.map((s) => "<li>" + esc(s) + "</li>").join("") + '</ol><p class="src">One common order; your family or purohit may differ.</p></div></details>';
		h += '<div class="check">' + f.core.map((x) => taskHtml(f, day.date, x)).join("") + '</div></section>';

		if (f.samagri) h += '<details class="fold"><summary>Samagri</summary><div class="kv">' + f.samagri.map(([k, v]) => "<b>" + esc(k) + "</b><span>" + esc(v) + "</span>").join("") + '</div></details>';
		const used = [...new Set(f.core.filter((x) => x.text).map((x) => x.text))];
		h += '<details class="fold"><summary>Texts for this sadhana</summary><div class="texts">' + used.map((k) => '<button class="link" data-go="t/' + k + '">' + esc(TEXTS[k].title) + '</button>').join("") + '<button class="link" data-go="d/' + f.deity + '">All ' + esc(GOD[f.deity].name) + ' mantras</button></div></details>';
		h += footer();
		main.innerHTML = h;
	}

	function viewText(key) {
		setTab("home");
		const tx = TEXTS[key];
		if (!tx) return viewHome();
		const mr = tx.lang === "mr" || tx.lang === "hi";
		const cls = mr ? "mr" : "sa";
		let h = '<button class="link back" data-back>← Back</button>';
		h += '<section class="hero"><span class="dv' + (mr ? " mr" : "") + '">' + esc(tx.deva) + '</span><h1>' + esc(tx.title) + '</h1><p class="muted">' + esc(tx.about) + '</p></section>';
		h += '<div class="script-tog chips" role="group" aria-label="Script">' + [["both", "Both"], ["deva", "देवनागरी"], ["iast", "IAST"]].map(([k, l]) => '<button class="chip" aria-pressed="' + (state.script === k) + '" data-script="' + k + '">' + l + '</button>').join("") + '</div>';
		if (tx.names) {
			h += '<ol class="names">' + tx.names.map((n) => '<li><span class="sa">' + esc(n) + '</span><span class="lat">' + esc(iast(n)) + '</span></li>').join("") + '</ol>';
		} else {
			h += '<div class="text-body">' + tx.blocks.map((b) => b.head ? '<div class="verse"><h3>' + esc(b.head) + ' <span class="lat keep">' + esc(iast(b.head)) + '</span></h3></div>' :
				'<div class="verse"><p class="' + cls + '">' + esc(b.lines.join("\n")) + '</p><p class="lat">' + esc(b.lines.map((l) => iast(l, mr)).join("\n")) + '</p>' + (b.mean ? '<p class="mean">' + esc(b.mean) + '</p>' : "") + '</div>').join("") + '</div>';
		}
		if (tx.mean) h += '<details class="fold"><summary>Meaning</summary><div><p class="mean" style="white-space:pre-line">' + esc(tx.mean) + '</p></div></details>';
		h += '<p class="src">Source: <a href="' + esc(tx.url) + '" target="_blank" rel="noopener">' + esc(tx.src) + '</a>. ' + esc(tx.credit || "") + '</p>';
		h += footer();
		main.innerHTML = h;
		document.body.dataset.script = state.script;
	}

	function viewMantras() {
		setTab("mantra");
		let h = '<section class="hero"><span class="dv">मन्त्र</span><h1>Mantras by deity</h1><p class="muted">Each with its source, the usual count, and a mala to count on.</p></section>';
		h += '<div class="gods">' + DEITIES.map((d) => '<button class="god" data-go="d/' + d.id + '"><span class="dv">' + esc(d.deva) + '</span><b>' + esc(d.name) + '</b><small>' + esc(d.day) + '</small></button>').join("") + '</div>';
		h += '<p class="src">Seed (bija) mantras such as गं, श्रीं, ऐं, दुं and हं are traditionally learnt from a guru. The nama mantras and shlokas are open to everyone.</p>';
		h += footer();
		main.innerHTML = h;
	}

	function viewDeity(id) {
		setTab("mantra");
		const d = GOD[id];
		if (!d) return viewMantras();
		let h = '<button class="link back" data-go="mantras">← All deities</button>';
		h += '<section class="hero"><span class="dv">' + esc(d.deva) + '</span><h1>' + esc(d.name) + '</h1><p class="muted">' + esc(d.about) + " Days: " + esc(d.day) + '.</p></section><div>';
		for (const m of d.mantras) {
			const ref = d.id + "/" + m.id;
			const j = japaOf(ref);
			h += '<article class="mantra"><span class="eyebrow">' + esc(m.name) + '</span><p class="sa">' + esc(m.deva) + '</p><p class="lat">' + esc(iast(m.deva)) + '</p><p class="mean">' + esc(m.mean) + '</p>' +
				'<p class="meta"><span>Usual count: ' + m.count + '</span><span>' + esc(m.src) + '</span>' + (j.total ? '<span class="meter">' + j.total + ' counted so far</span>' : "") + '</p>' +
				'<button class="btn quiet" data-japa="' + ref + '" data-iso="' + todayIso() + '" data-target="' + m.count + '">Count on mala</button></article>';
		}
		h += '</div>';
		const fests = FESTIVALS.filter((f) => f.deity === d.id);
		if (fests.length) h += '<p class="muted">Festivals: ' + fests.map((f) => f.status === "ready" ? '<a href="#f/' + f.id + '" data-go="f/' + f.id + '">' + esc(f.name) + "</a>" : esc(f.name) + " (coming)").join(", ") + '.</p>';
		h += footer();
		main.innerHTML = h;
	}

	function footer() {
		return '<footer class="foot"><p>Long texts are reproduced from <a href="https://sanskritdocuments.org" target="_blank" rel="noopener">sanskritdocuments.org</a> (volunteer-prepared, for personal study) and the aarti from Wikipedia. Festival dates and moonrise are for Pune, from Drik Panchang.</p><p>Follow your family custom or purohit where it differs.</p></footer>';
	}

	/* ---------- router ---------- */
	let route = "";
	let history_ = [];
	function go(r, opts) {
		if (!opts || !opts.back) history_.push(route);
		route = r;
		try { if (/^[A-Za-z0-9._~-]*$/.test(r.replace(/\//g, "-"))) location.hash = r ? r.replace(/\//g, "-") : ""; } catch (e) { /* ignore */ }
		render();
		window.scrollTo(0, 0);
		main.focus({ preventScroll: true });
	}
	function render() {
		const [kind, a, b] = route.split("/");
		if (kind === "f") viewFestival(a, b);
		else if (kind === "t") viewText(a);
		else if (kind === "mantras") viewMantras();
		else if (kind === "d") viewDeity(a);
		else viewHome();
		document.body.dataset.script = state.script;
	}
	function fromHash() {
		const h = (location.hash || "").slice(1);
		const m = h.match(/^(f|t|d)-([a-z0-9]+)(?:-(\d{4}-\d{2}-\d{2}))?$/);
		if (m) return m[1] + "/" + m[2] + (m[3] ? "/" + m[3] : "");
		return h === "mantras" ? "mantras" : "";
	}

	/* ---------- japa sheet ---------- */
	const sheet = $("japa");
	let jp = null; // { ref, iso, task, target }
	let wake = null;
	(function buildBeads() {
		const ns = "http://www.w3.org/2000/svg";
		const svg = $("mala-svg");
		const core = document.createElementNS(ns, "circle");
		core.setAttribute("cx", "66"); core.setAttribute("cy", "66"); core.setAttribute("r", "47"); core.setAttribute("class", "core");
		svg.appendChild(core);
		for (let i = 0; i < MALA; i++) {
			const a = (-90 + (i + 1.5) * (360 / (MALA + 3))) * Math.PI / 180;
			const c = document.createElementNS(ns, "circle");
			c.setAttribute("cx", (66 + 60 * Math.cos(a)).toFixed(2)); c.setAttribute("cy", (66 + 60 * Math.sin(a)).toFixed(2));
			c.setAttribute("r", "1.75"); c.setAttribute("class", "bead");
			svg.appendChild(c);
		}
		const meru = document.createElementNS(ns, "circle");
		meru.setAttribute("cx", "66"); meru.setAttribute("cy", "6"); meru.setAttribute("r", "3.4"); meru.setAttribute("class", "meru");
		svg.appendChild(meru);
	})();
	const beads = Array.from(document.querySelectorAll("#mala-svg .bead"));
	function renderJapa() {
		const j = japaOf(jp.ref);
		const n = j.n % MALA;
		const today = japaOn(jp.ref, jp.iso);
		$("mala-n").textContent = n;
		beads.forEach((b, i) => b.classList.toggle("on", i < n));
		$("japa-today").innerHTML = (jp.iso === todayIso() ? "Today " : esc(fmt(jp.iso, { day: "numeric", month: "short" })) + " ") + "<b>" + today + "</b>" + (jp.target ? " of " + jp.target : "");
		$("japa-total").textContent = j.total + " in all";
		$("mala").setAttribute("aria-label", "Count one repetition. " + n + " of 108 on this mala, " + today + " today");
	}
	function openJapa(ref, iso, task, target) {
		const m = mantraOf(ref);
		jp = { ref, iso, task, target: target ? Number(target) : 0 };
		$("japa-name").textContent = GOD[ref.split("/")[0]].name + " · " + m.name;
		$("japa-deva").textContent = m.deva;
		$("japa-iast").textContent = iast(m.deva);
		sheet.hidden = false;
		document.documentElement.style.overflow = "hidden";
		renderJapa();
		$("mala").focus();
		if (navigator.wakeLock) navigator.wakeLock.request("screen").then((w) => { wake = w; }).catch(() => {});
	}
	function closeJapa() {
		sheet.hidden = true;
		document.documentElement.style.overflow = "";
		if (wake) { wake.release().catch(() => {}); wake = null; }
		jp = null;
		save();
		render();
	}
	function count(d) {
		const j = japaOf(jp.ref);
		if (d < 0 && (j.n <= 0 || japaOn(jp.ref, jp.iso) <= 0)) return;
		j.n += d; j.total += d;
		j.byDay[jp.iso] = japaOn(jp.ref, jp.iso) + d;
		const today = j.byDay[jp.iso];
		if (navigator.vibrate) navigator.vibrate(d > 0 && j.n % MALA === 0 ? [60, 60, 120] : 12);
		if (jp.task) state.done[jp.task] = jp.target ? today >= jp.target : state.done[jp.task];
		renderJapa();
		save();
	}
	$("mala").addEventListener("click", () => count(1));
	$("mala-undo").addEventListener("click", () => count(-1));
	$("japa-close").addEventListener("click", closeJapa);
	document.addEventListener("keydown", (e) => {
		if (sheet.hidden) return;
		if (e.key === "Escape") closeJapa();
		else if ((e.key === " " || e.key === "Enter") && document.activeElement === $("mala")) { e.preventDefault(); count(1); }
	});
	document.addEventListener("visibilitychange", () => {
		// The browser drops the lock while the page is hidden; ask again when it comes back.
		if (document.visibilityState !== "visible") { wake = null; return; }
		if (!sheet.hidden && !wake && navigator.wakeLock) navigator.wakeLock.request("screen").then((w) => { wake = w; }).catch(() => {});
	});

	/* ---------- events ---------- */
	document.addEventListener("click", (e) => {
		const el = e.target.closest("[data-go],[data-tick],[data-days],[data-malas],[data-day],[data-japa],[data-script],[data-back]");
		if (!el) return;
		if (el.tagName === "A") e.preventDefault();
		const [kind, id] = route.split("/");
		if (el.dataset.japa) return openJapa(el.dataset.japa, el.dataset.iso, el.dataset.task, el.dataset.target);
		if (el.hasAttribute("data-back")) { const p = history_.pop(); return go(p || "", { back: true }); }
		if (el.dataset.go !== undefined) return go(el.dataset.go);
		if (el.dataset.tick) { state.done[el.dataset.tick] = !state.done[el.dataset.tick]; save(); render(); return; }
		if (el.dataset.days) { state.plan[id].days = Number(el.dataset.days); save(); render(); return; }
		if (el.dataset.malas) { state.plan[id].malas = Number(el.dataset.malas); save(); render(); return; }
		if (el.dataset.day) { route = "f/" + id + "/" + el.dataset.day; render(); return; }
		if (el.dataset.script) { state.script = el.dataset.script; save(); render(); }
	});
	$("home-btn").addEventListener("click", () => go(""));
	window.addEventListener("hashchange", () => {
		const r = fromHash();
		if (r !== route && !route.startsWith(r + "/")) { route = r; render(); }
	});

	route = fromHash();
	render();
})();
</script>
</body></html>
